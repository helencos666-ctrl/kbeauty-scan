<body class="compose">
<header>
  <h1>✏️ 发帖</h1>
  <p><a href="/community">← 返回社区</a></p>
</header>
<div class="compose-top">
  <a class="back" href="/community">取消</a>
  <h1 id="composeTitle">写帖子</h1>
  <div class="acts">
    <button type="button" class="btn ghost" id="preview" disabled hidden style="display:none">预览</button>
    <button type="button" class="btn primary" id="send" disabled>发布</button>
  </div>
</div>
<main>
  <div class="card" id="gate"><div class="loading">加载中…</div></div>
  <div class="card" id="form" style="display:none">
    <div class="draftnote" id="draftnote"></div>
    <div class="err" id="err"></div>
    <input type="hidden" id="board" value="daily">
    <div id="chanbox" style="display:none">
    <div class="chips" id="chips"></div>
    </div>
    <div id="mcatbox" style="display:none;margin-top:10px">
      <label class="f" for="mcat">商家分类（选填）</label>
      <select class="f" id="mcat">
        <option value="">不选择</option>
        <option value="guide">地陪向导</option>
        <!-- feature:medical-aesthetic --><option value="clinic">医美</option><!-- /feature:medical-aesthetic -->
        <option value="food">美食代点外卖</option>
        <option value="airport">接送机</option>
        <option value="hotel">住宿</option>
        <option value="interp">翻译</option>
        <option value="kpop">追星活动</option>
        <option value="car">租车</option>
        <option value="sim">通讯电话卡</option>
        <option value="logistics">物流快递</option>
        <option value="daigou">代购</option>
        <option value="other">其它</option>
      </select>
      <div class="tip">商家发布先审后发；分类会显示在商家页的「商家发布」信息流里，<!-- feature:medical-aesthetic -->选「医美」时请遵守下面的医疗内容规范。<!-- /feature:medical-aesthetic --></div>
    </div>
    <div class="mednote" id="mednote" style="display:none"></div>
    <div class="tip" id="quota" style="display:none"></div>
    <div class="warn" id="bwarn" style="display:none;margin-top:10px"></div>
    <div id="actbox" style="display:none">
      <label class="f">分类标签</label>
      <select class="f" id="tag"></select>
      <label class="f">优惠 / 价格（选填，60 字内）</label>
      <input class="f" id="offer" maxlength="60" placeholder="例如：新客体验价 ₩59,000（原价 ₩89,000）">
      <label class="f">有效期至（选填）</label>
      <input class="f" id="valid" type="date">
      <div class="tip">商家活动帖<b>先审后发</b>。请勿填写微信、QQ、电话、二维码等站外联系方式，用户会通过站内「立即咨询」联系你。</div>
    </div>
    <div class="compose-who" id="composeWho" hidden></div>
    <label class="f">图片（最多 6 张，会自动压缩）</label>
    <input type="file" id="pick" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <label class="f" id="tlab">标题（选填）</label>
    <input class="f" id="title" maxlength="40" placeholder="选填，一句话也可以">
    <div class="count" id="tcount">0 / 40</div>
    <div class="show-cats" id="showCats" role="group" aria-label="分类（选填）">
      <button type="button" data-cat="food">美食</button>
      <button type="button" data-cat="shop">购物</button>
      <button type="button" data-cat="sight">景点</button>
      <button type="button" data-cat="hotel">酒店</button>
      <button type="button" data-cat="coffee">咖啡推荐</button>
      <button type="button" data-cat="selfie">自拍</button>
    </div>
    <input type="hidden" id="showCat" value="">
    <div class="spot-box" id="spotBox" hidden>
      <label class="f" for="spotName">店名/地名</label>
      <input class="f sm" id="spotName" maxlength="40" placeholder="必填，例如店名或景点名" autocomplete="off">
      <label class="f" for="spotArea">地址或区域（选填）</label>
      <input class="f sm" id="spotArea" maxlength="40" placeholder="例如：明洞、弘大" autocomplete="off">
      <label class="f" for="avgPrice">人均（选填）</label>
      <div class="price-row"><span class="won">₩</span><input class="f sm" id="avgPrice" inputmode="numeric" maxlength="8" placeholder="例如 15000" autocomplete="off"></div>
    </div>
    <label class="f" id="blab">正文（选填）</label>
    <textarea class="f" id="body" maxlength="3000" placeholder="选填，想写就写" style="min-height:140px;line-height:1.7"></textarea>
    <div class="count" id="bcount">0 / 3000</div>
    <div id="topicbox" style="display:none">
    <input class="f" id="topics" maxlength="40" value="" autocomplete="off">
    </div>
    <div id="placebox" style="display:none">
    <input class="f" id="place" maxlength="40" value="" autocomplete="off">
    </div>
    <label class="agree-line">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意<a href="/rules" target="_blank" style="color:#2c7be5">《社区约定》</a></span>
    </label>
  </div>
</main>
<div class="preview-mask" id="previewMask">
  <div class="preview-sheet">
    <div class="meta" id="pvBoard"></div>
    <h3 id="pvTitle"></h3>
    <div class="body" id="pvBody"></div>
    <div class="phs" id="pvPhotos"></div>
    <button type="button" class="btn ghost block" id="pvClose" style="margin-top:16px">关闭预览</button>
  </div>
</div>

function lhFlags(){ return window.LH_FLAGS || {}; }
function lhHiddenBoard(b){ return (lhFlags().hidden_boards || []).indexOf(b) >= 0; }
function lhHiddenCat(c){ return (lhFlags().hidden_cats || []).indexOf(c) >= 0; }
function applyHiddenFlags(){
  (lhFlags().hidden_cats || []).forEach(function(c){
    var opt = document.querySelector('#mcat option[value="'+c+'"]');
    if (opt) opt.remove();
  });
  (lhFlags().hidden_boards || []).forEach(function(b){
    var chip = document.querySelector('#chips [data-board="'+b+'"], #chips button[data-k="'+b+'"]');
    if (chip) chip.remove();
  });

var CITY_BOX = [
  ['济州',126.1,33.1,126.98,33.62],['釜山',128.75,34.95,129.35,35.4],
  ['大邱',128.4,35.7,128.8,36.05],['光州',126.7,35.05,127.05,35.28],

];
function fillPlace(){
  var el = document.getElementById('place'); if (!el || el.dataset.edited) return;
  if (!el.value.trim()) el.value = '首尔';
  el.addEventListener('input', function(){ el.dataset.edited = '1'; });
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    if (el.dataset.edited) return;
    var lat = pos.coords.latitude, lng = pos.coords.longitude, city = '首尔';
    for (var i = 0; i < CITY_BOX.length; i++){
      var b = CITY_BOX[i];
      if (lng >= b[1] && lat >= b[2] && lng <= b[3] && lat <= b[4]){ city = b[0]; break; }
    }
    if (!el.dataset.edited) el.value = city;
  }, function(){}, {maximumAge:600000, timeout:8000, enableHighAccuracy:false});
}

async function recordsToFiles(val){
  if (window.lhComposeRecordsToFiles) return window.lhComposeRecordsToFiles(val);
  var out = [], arr = Array.isArray(val) ? val : [];
  for (var i = 0; i < arr.length; i++){
    var rec = arr[i], buf = rec && rec.buf, name = (rec && rec.name) || 'img.jpg', type = (rec && rec.type) || 'image/jpeg';
    if (rec && typeof Blob !== 'undefined' && rec instanceof Blob && !buf){
      try { buf = await rec.arrayBuffer(); name = rec.name || name; type = rec.type || type; } catch(e){ buf = null; }
    }
    if (!buf || buf.byteLength === 0) continue;
    out.push(new File([buf], name, {type: type || 'image/jpeg'}));
  }
  return out;
}
function takeComposeImages(){
  if (window.lhTakeComposeImages) return window.lhTakeComposeImages();
  return new Promise(function(resolve){
    try {
      var req = indexedDB.open('lh-compose-pending', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('files'); };
      req.onsuccess = function(){
        var db = req.result, tx = db.transaction('files', 'readwrite'), st = tx.objectStore('files'), g = st.get('images');
        g.onsuccess = function(){
          try { st.delete('images'); } catch(e){}
          var val = g.result || [];
          resolve(Array.isArray(val) ? val : []);
        };
        g.onerror = function(){ resolve([]); };
        tx.oncomplete = function(){ try { db.close(); } catch(e){} };
      };
      req.onerror = function(){ resolve([]); };
    } catch(e){ resolve([]); }
  }).then(recordsToFiles);
}
async function loadPendingImages(){

      if (draft.agree) document.getElementById('agree').checked = true;
      syncListingFields();
      var n = document.getElementById('draftnote'); n.style.display = 'block'; n.textContent = '草稿已自动保存 · 刚刚';
      updateCounts();
      await loadPendingImages();
      return;
    }
    document.getElementById('board').value = 'daily';
    bindShowCats();
    applyShowCat(draft.show_cat || '', true);
    if (document.getElementById('spotName')) document.getElementById('spotName').value = draft.spot_name || '';
    if (document.getElementById('spotArea')) document.getElementById('spotArea').value = draft.spot_area || '';
    if (document.getElementById('avgPrice')) document.getElementById('avgPrice').value = draft.avg_price || '';
    if (draft.title) document.getElementById('title').value = draft.title;
    if (draft.body){ document.getElementById('body').value = draft.body; if (TPL[draft.board] && draft.body === TPL[draft.board]) lastTpl = draft.body; }
    if (draft.topics) document.getElementById('topics').value = draft.topics;
    if (draft.place){ document.getElementById('place').value = draft.place; document.getElementById('place').dataset.edited = '1'; }
    if (MB[currentBoard()]){
      if (draft.tag) document.getElementById('tag').value = draft.tag;
      if (draft.offer) document.getElementById('offer').value = draft.offer;
      if (draft.valid) document.getElementById('valid').value = draft.valid;
    }
    if (draft.mcat) { document.getElementById('mcat').value = draft.mcat; if (MCAT_TPL[draft.mcat] && draft.body === MCAT_TPL[draft.mcat]) lastTpl = draft.body; }
    if (draft.agree) document.getElementById('agree').checked = true;
    syncMedNote();
    var n = document.getElementById('draftnote'); n.style.display = 'block'; n.textContent = '草稿已自动保存 · 刚刚';
  } else {
    document.getElementById('board').value = 'daily'; lastTpl = '';
  }
  updateCounts();
  await loadPendingImages();
})();
function drawThumbs(){
  var el = document.getElementById('thumbs');
  el.innerHTML = '';
  files.forEach(function(f, i){
    var d = document.createElement('div'), im = document.createElement('img'), x = document.createElement('button');
    d.className = 'tile';
    im.src = URL.createObjectURL(f); x.type = 'button'; x.textContent = '×'; x.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); files.splice(i, 1); drawThumbs(); };
    d.appendChild(im); d.appendChild(x); el.appendChild(d);
  });
  if (files.length < 6){
    var add = document.createElement('button');
    add.type = 'button'; add.className = 'add'; add.innerHTML = '<b>+</b>添加';
    add.onclick = function(){ document.getElementById('pick').click(); };
    el.appendChild(add);
  }
}
drawThumbs();
document.getElementById('pick').onchange = async function(){
  var picked = Array.from(this.files || []);
  var ok = [];
  try {
    for (var i = 0; i < picked.length; i++){
      if (files.length + ok.length >= 6){ LH.toast('最多 6 张图片'); break; }
      ok.push(await LH.compress(picked[i]));
    }
  } catch(e){
    var msg = (e && e.message) || '有图片读取失败，可能是 iCloud 原图未下载，请重试';
    LH.showErr(document.getElementById('err'), msg); LH.toast(msg);
  }
  this.value = '';
  ok.forEach(function(f){ if (files.length < 6) files.push(f); });
  drawThumbs();
};
function setSending(on){
  ['send','preview'].forEach(function(id){
    var b = document.getElementById(id); b.disabled = on;
  });
  document.getElementById('send').textContent = on ? '发布中…' : '发布';
}
document.getElementById('preview').onclick = function(){
  var title = document.getElementById('title').value.trim();
  var body = document.getElementById('body').value.trim();
  document.getElementById('pvBoard').innerHTML = '';
  document.getElementById('pvTitle').textContent = title || '（还没有标题）';
  document.getElementById('pvBody').textContent = body || '（还没有正文）';
  var box = document.getElementById('pvPhotos');
  box.innerHTML = '';
  files.forEach(function(f, i){
    var im = document.createElement('img');
    im.src = URL.createObjectURL(f);
    if (files.length === 1) im.className = 'one';
    box.appendChild(im);
  });
  document.getElementById('previewMask').classList.add('show');
};
document.getElementById('pvClose').onclick = function(){ document.getElementById('previewMask').classList.remove('show'); };
document.getElementById('previewMask').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('show'); });
document.getElementById('send').onclick = async function(){
  var err = document.getElementById('err'); LH.showErr(err, '');
  if (!document.getElementById('agree').checked){ LH.showErr(err, '请先勾选同意社区规则'); window.scrollTo(0, 0); return; }
  if (LISTING && lastTpl && document.getElementById('body').value.trim() === lastTpl.trim()){ LH.showErr(err, '把模板里的括号和省略号换成你自己的内容再发吧'); window.scrollTo(0, 0); return; }
  if (!LISTING && !document.getElementById('title').value.trim() && !document.getElementById('body').value.trim() && !files.length){
    LH.showErr(err, '请添加图片，或写标题或正文'); window.scrollTo(0, 0); return;
  }
  if (LISTING){
    var mc = (document.getElementById('mcat') || {}).value || '';
    if (!mc){ LH.showErr(err, '请选择商家分类'); window.scrollTo(0, 0); return; }
    document.getElementById('board').value = CAT_TO_BOARD[mc] || 'daigou';
  } else {
    document.getElementById('board').value = 'daily';
  }
  if (!currentBoard()){ LH.showErr(err, '请选择商家分类'); window.scrollTo(0, 0); return; }
  if (lhHiddenBoard(currentBoard()) || lhHiddenCat((document.getElementById('mcat')||{}).value || '')){
    LH.showErr(err, (lhFlags().unavailable_message) || '该项目暂未开放'); window.scrollTo(0, 0); return;
  }
  var fd = new FormData();
  fd.append('board', currentBoard());
  fd.append('merchant_cat', (document.getElementById('mcat') || {}).value || '');
  fd.append('title', document.getElementById('title').value);
  fd.append('body', document.getElementById('body').value);
  var topicsEl = document.getElementById('topics');
  fd.append('topics', topicsEl && !LISTING ? '' : ((topicsEl && topicsEl.value) || ''));
  fd.append('place', LISTING && document.getElementById('place') ? document.getElementById('place').value : '');
  fd.append('show_cat', LISTING ? '' : currentShowCat());
  var spotOn = !LISTING && SPOT_CATS[currentShowCat()];
  if (spotOn && !(document.getElementById('spotName').value || '').trim()){
    LH.showErr(err, '请填写店名/地名'); window.scrollTo(0, 0); return;
  }
  fd.append('spot_name', spotOn ? document.getElementById('spotName').value : '');
  fd.append('spot_area', spotOn ? document.getElementById('spotArea').value : '');
  fd.append('avg_price', spotOn ? document.getElementById('avgPrice').value : '');
  if (MB[currentBoard()]){
    fd.append('tag', document.getElementById('tag').value); fd.append('offer', document.getElementById('offer').value); fd.append('valid_until', document.getElementById('valid').value);
  }
  var rebuilt = [], total = 0;
  try {
    for (var i = 0; i < files.length; i++){
      var buf = await files[i].arrayBuffer();
      if (!buf || buf.byteLength === 0) throw new Error('有图片读取失败，请删除后重新选择');
      total += buf.byteLength;
      rebuilt.push(new File([buf], 'img.jpg', {type: files[i].type || 'image/jpeg'}));
    }
  } catch(e){
    LH.showErr(err, e.message || '有图片读取失败，请重新选择'); window.scrollTo(0, 0); return;
  }
  if (total >= 18 * 1024 * 1024){
    LH.showErr(err, '图片总大小超过 18MB，请减少张数或换小一点的图'); window.scrollTo(0, 0); return;
  }
  files = rebuilt;
  rebuilt.forEach(function(f){ fd.append('images', f, 'img.jpg'); });
  setSending(true);
  try {
    var r = await LH.api('POST', '/api/community/posts', fd);
    clearDraft();
    if (r.pending){ LH.toast(r.message || '已提交，等待审核', 'ok', 4000); }
    else { LH.toast('发布成功', 'ok', 2000); }
    setTimeout(function(){ location.href = '/community/post/' + r.id; }, r.pending ? 900 : 800);
  } catch(e){
    var msg = e.message || '发布失败，请稍后重试';
    if (e.status === 400 && /未到达/.test(msg)) msg = '上传内容未到达服务器，请刷新页面或重新选图后再试';
    try { saveDraft(); } catch(x){}
    LH.showErr(err, msg); LH.toast(msg); setSending(false); window.scrollTo(0, 0);
  }
};
</script>
