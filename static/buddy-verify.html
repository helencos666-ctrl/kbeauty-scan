<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅游搭子实名核验 · 旅韩助手</title>
<meta name="description" content="旅游搭子实名核验：只收集证件号码后四位和可供遮挡的证件照片，不收集完整住民登录号或护照号。">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=79">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=79">
<link rel="stylesheet" href="/static/pwa.css?v=79">
<link rel="stylesheet" href="/static/community.css?v=79">
<meta name="robots" content="noindex">
</head>
<body>
<header>
  <h1>🪪 旅游搭子实名核验</h1>
  <p><a href="/community/friends">‹ 返回旅韩交友</a></p>
</header>
<main>
  <div class="card">
    <p class="note" id="disc" style="background:#fff8f0;border-radius:10px;padding:10px 12px;line-height:1.7">仅限结伴旅游，不是交友/约会平台，禁止色情、诈骗、金钱往来，注意人身安全。</p>
    <p class="tip">按照韩国《个人信息保护法》，本站<b>不收集</b>完整住民登录号（주민등록번호）或完整护照号，只填写<b>证件号码后四位</b>。证件照片可以自行遮挡敏感部分，仅供管理员审核，通过或拒绝后立即删除。</p>
  </div>
  <div class="err" id="err" style="display:none"></div>
  <div class="ok" id="ok" style="display:none"></div>
  <div class="card" id="status">加载中…</div>
  <div class="card" id="formbox" style="display:none">
    <label class="f">真实姓名</label><input class="f" id="real_name" maxlength="40" placeholder="与证件一致的姓名">
    <label class="f">国籍</label><select class="f" id="nationality"></select>
    <label class="f">证件类型</label><select class="f" id="id_type"></select>
    <label class="f">证件号码后四位（只要 4 位）</label>
    <input class="f" id="last4" maxlength="4" placeholder="例如 1234" autocapitalize="characters" autocomplete="off">
    <label class="f">证件照片（可自行遮挡完整号码等敏感部分）</label>
    <input class="f" id="photo" type="file" accept="image/*">
    <label class="f" style="display:flex;align-items:flex-start;gap:8px;margin-top:12px">
      <input type="checkbox" id="consent" style="margin-top:4px">
      <span id="consentText" class="tip" style="margin:0"></span>
    </label>
    <button class="btn primary block" id="sub" style="margin-top:12px">提交审核</button>
  </div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">详细说明见 <a href="/privacy" style="color:#2c7be5">隐私政策</a>。</p>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=79"></script>
<script>
(async function(){
  var d = await LH.userbar();
  var err = document.getElementById('err'), ok = document.getElementById('ok');
  function show(el,t){ el.textContent=t||''; el.style.display=t?'block':'none'; }
  if (!d || !d.user){
    document.getElementById('status').innerHTML = '<p>请先登录后再提交核验。</p><a class="btn primary block" href="/login?next=/community/friends/verify">去登录</a>';
    return;
  }
  var meta;
  try { meta = await LH.api('GET', '/api/id-verify/me'); }
  catch(e){ document.getElementById('status').textContent = e.message; return; }
  if (meta.disclaimer) document.getElementById('disc').textContent = meta.disclaimer;
  document.getElementById('consentText').textContent = meta.consent_text || '';
  function fill(sel, obj){
    sel.innerHTML = '<option value="">请选择</option>' + Object.keys(obj).map(function(k){ return '<option value="'+LH.esc(k)+'">'+LH.esc(obj[k])+'</option>'; }).join('');
  }
  fill(document.getElementById('id_type'), meta.id_types || {});
  var nats = {}; (meta.nationalities||[]).forEach(function(x){ nats[x]=x; });
  fill(document.getElementById('nationality'), nats);
  var st = document.getElementById('status');
  if (meta.banned){
    st.innerHTML = '<b>你已被限制使用旅游搭子功能。</b><p class="tip">' + LH.esc(meta.ban_reason||'') + (meta.ban_until?(' 至 '+LH.esc(meta.ban_until)):'') + '</p>';
    return;
  }
  if (meta.verified){
    st.innerHTML = '<b>你已通过实名核验。</b><p class="tip">资料卡上会显示「已实名」。证件照片已在审核后删除，本站只保留姓名、国籍、证件类型和后四位。</p><a class="btn primary" href="/community/friends?purpose=buddy">去看旅游搭子</a>';
    return;
  }
  var app = meta.application;
  if (app && app.status === 'pending'){
    st.innerHTML = '<b>申请审核中。</b><p class="tip">提交于 ' + LH.esc(app.time||'') + '。请等待管理员处理，证件照片仅在此期间保存。</p>';
    return;
  }
  if (app && app.status === 'rejected'){
    st.innerHTML = '<b>上次申请未通过。</b><p class="tip">' + LH.esc(app.reject_reason||'未通过核验') + '。你可以修改后重新提交。</p>';
  } else {
    st.innerHTML = '<b>尚未完成核验。</b><p class="tip">通过后才能发布或查看旅游搭子详情、联系对方。</p>';
  }
  document.getElementById('formbox').style.display = 'block';
  document.getElementById('sub').onclick = async function(){
    show(err,''); show(ok,'');
    var f = new FormData();
    f.append('real_name', document.getElementById('real_name').value);
    f.append('nationality', document.getElementById('nationality').value);
    f.append('id_type', document.getElementById('id_type').value);
    f.append('last4', document.getElementById('last4').value);
    f.append('consent', document.getElementById('consent').checked ? '1' : '');
    var file = document.getElementById('photo').files[0];
    if (!file){ show(err,'请上传证件照片'); return; }
    try {
      var blob = await LH.compress(file);
      f.append('image', blob, 'doc.jpg');
      var r = await LH.api('POST', '/api/id-verify', f);
      show(ok, r.message || '已提交');
      document.getElementById('formbox').style.display = 'none';
    } catch(e){ show(err, e.message); }
  };
})();
</script>
<script src="/static/pwa.js?v=79" defer></script>
</body>
</html>
