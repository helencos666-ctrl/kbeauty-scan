<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="旅韩助手站内私信。">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<header>
  <h1>消息</h1>
  <p><a href="/me">‹ 我的</a></p>
</header>
<main>
  <div class="hintbar">只显示对方的昵称和头像。手机号、邮箱不会出现在会话里。</div>
  <div class="card" id="box"><div class="loading">加载中…</div></div>
  <div class="card" id="bbox" style="display:none"><h2>黑名单</h2><div id="blist"></div></div>
  <div class="footlinks"><a href="/community">韩友圈</a>·<a href="/rules#r8">交友约定</a></div>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me" class="on"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=74"></script>
<script>
var E = LH.esc;
async function loadList(){
  var box = document.getElementById('box');
  var m = await LH.userbar();
  if (!m) { box.innerHTML = '<div class="empty">社区暂未开放</div>'; return; }
  if (!m.user){ box.innerHTML = '<div class="empty">登录后查看私信<br><br><a class="btn primary" href="/login?next=/community/messages">登录 / 注册</a></div>'; return; }
  try {
    var d = await LH.api('GET', '/api/chat/threads');
    box.innerHTML = d.threads.length ? d.threads.map(function(t){
      return '<a class="thr" href="/community/messages/' + t.id + '"><span class="avwrap">' +
        LH.avatar(t.other, t.nickname, t.has_avatar, 'md', t.cover ? ('/api/friends/photo/' + t.cover + '?t=1') : '') +
        (t.unread ? '<span class="dot">' + (t.unread > 99 ? '99+' : t.unread) + '</span>' : '') + '</span><span class="tx"><b>' + E(t.nickname) + '</b>' + LH.vb(t.verified) +
        (t.blocked ? ' <small style="color:#c62828">已拉黑</small>' : '') + (t.flagged ? ' <small style="color:#8a5300">含敏感词</small>' : '') +
        '<p>' + E(t.last) + '</p></span><span class="tm">' + E((t.time || '').slice(5)) + '</span></a>';
    }).join('') : '<div class="empty">还没有私信。在普通帖子或作者主页点「私聊」，就可以和注册会员在站内沟通。</div>';
    var b = await LH.api('GET', '/api/friends/blocks');
    if (b.blocks.length){
      document.getElementById('bbox').style.display = 'block';
      document.getElementById('blist').innerHTML = b.blocks.map(function(x){ return '<div class="row" style="justify-content:space-between;padding:8px 0"><span>' + E(x.nickname) + '</span><button class="btn sm gray" data-ub="' + x.uid + '">解除拉黑</button></div>'; }).join('');
      document.querySelectorAll('[data-ub]').forEach(function(btn){ btn.onclick = async function(){ await LH.api('POST', '/api/friends/block/' + btn.dataset.ub, {}); location.reload(); }; });
    }
  } catch(e){ box.innerHTML = '<div class="empty">' + E(e.message) + '</div>'; }
}
loadList();
setInterval(function(){ if (!document.hidden) loadList(); }, 30000);
</script>
<script src="/static/pwa.js?v=74" defer></script>
</body>
</html>
