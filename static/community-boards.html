<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head>
<body>
<header>
  <h1>🗂️ 全部频道</h1>
  <p>点“＋ 关注”，频道新帖会出现在“我关注的”里</p>
</header>
<main>
  <div class="err" id="err"></div>
  <div class="chpills" id="cats"></div>
  <div id="subs"><div class="loading">加载中…</div></div>
  <div class="footlinks" style="margin-top:14px"><a href="/community">返回社区</a>·<a href="/community/friends">旅韩交友</a>·<a href="/community/rate">汇率换算</a></div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">旅韩助手为个人运营的免费信息网站，内容仅供参考，不是旅行社，不代办签证。<br><a href="/terms" style="color:#2c7be5">用户协议与免责声明</a> · <a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/rules" style="color:#2c7be5">社区约定</a></p>
</main>
<a class="fab pill" href="/community/new">✏️ 写帖子</a>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=86"></script>
<script>
var data = null, cur = LH.qs('cat') || '', user = null;
function show(){
  document.getElementById('cats').innerHTML = data.categories.map(function(c){
    return '<a href="#cat-' + c.key + '">' + c.icon + ' ' + LH.esc(c.name) + '</a>';
  }).join('');
  document.getElementById('subs').innerHTML = data.categories.map(function(c){
    var extra = c.key === 'friends' ? '<div class="bitem"><i>💗</i><a href="/community/friends"><b>交友资料</b><small>看看谁在韩国，打个招呼</small></a></div>' : '';
    extra += c.key === 'life' ? '<div class="bitem"><i>💱</i><a href="/community/rate"><b>汇率换算</b><small>人民币 ↔ 韩元</small></a></div>' : '';
    return '<section class="chgroup" id="cat-' + c.key + '"><h2>' + c.icon + ' ' + LH.esc(c.name) + '</h2>' + c.boards.map(function(b){
      return '<div class="bitem"><i>' + b.icon + '</i><a href="/community?board=' + b.key + '"><b>' + LH.esc(b.name) + '</b><small>' +
        (b.desc ? LH.esc(b.desc) + '<br>' : '') + (b.merchant ? '商家会员发布 · ' : '') + (b.members_only ? '会员可看 · ' : '') + b.members + ' 人关注</small></a>' +
        '<button class="jbtn' + (b.joined ? ' on' : '') + '" data-j="' + b.key + '">' + (b.joined ? '已关注' : '＋ 关注') + '</button></div>';
    }).join('') + extra + '</section>';
  }).join('');
  document.querySelectorAll('#subs [data-j]').forEach(function(btn){
    btn.onclick = async function(){
      if (!user){ location.href = '/login?next=' + encodeURIComponent('/community/boards'); return; }
      try {
        var r = await LH.api('POST', '/api/community/boards/' + btn.dataset.j + '/join', {});
        data.categories.forEach(function(c){ c.boards.forEach(function(b){ if (b.key === btn.dataset.j){ b.joined = r.joined; b.members += r.joined ? 1 : -1; } }); });
        show();
      } catch(e){ alert(e.message); }
    };
  });
}
(async function(){
  try { var m = await LH.me(); user = m.user; } catch(e){}
  try { data = await LH.api('GET', '/api/community/boards'); }
  catch(e){ LH.showErr(document.getElementById('err'), e.message); return; }
  show();
  if (cur){ var el = document.getElementById('cat-' + cur); if (el) el.scrollIntoView(); }
})();
</script>
<script src="/static/pwa.js?v=86" defer></script>
</body>
</html>
