<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>推广中心 · 旅韩助手</title>
<meta name="description" content="旅韩助手推广中心：查看推广码、推荐注册和佣金。">
<meta name="theme-color" content="#146E68">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=102">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=102">
<link rel="stylesheet" href="/static/pwa.css?v=102">
<link rel="stylesheet" href="/static/community.css?v=102">
</head>
<body>
<header>
  <h1>📣 推广中心</h1>
  <p><a href="/member">‹ 会员</a> · <a href="/promo/rules">推广约定</a></p>
</header>
<main>
  <div class="err" id="err" style="display:none"></div>
  <div class="ok" id="ok" style="display:none"></div>
  <div id="box"><div class="card loading">加载中…</div></div>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=102"></script>
<script>
(async function(){
  var box = document.getElementById('box'), err = document.getElementById('err'), ok = document.getElementById('ok');
  function show(el,t){ el.textContent=t||''; el.style.display=t?'block':'none'; }
  var m = await LH.userbar();
  if (!m || !m.user){
    box.innerHTML = '<div class="card empty">请先登录后申请或查看推广数据。<br><br><a class="btn primary" href="/login?next=/promo">登录 / 注册</a></div>';
    return;
  }
  var d;
  try { d = await LH.api('GET', '/api/promo/me'); }
  catch(e){ box.textContent = e.message; return; }
  var lines = (d.policy_lines && d.policy_lines.length) ? d.policy_lines : [
    '朋友通过你的链接或二维码注册，30天内付费，你拿实付金额的50%。',
    '7天后结算，退款不算。',
    '只算你直接推荐的人。'
  ];
  var terms = '<ul class="promo-policy" style="margin:10px 0 0;padding:0 0 0 18px">' + lines.map(function(t){ return '<li style="font-size:14px;line-height:1.7;margin:0 0 4px">' + LH.esc(t) + '</li>'; }).join('') + '</ul>' +
    '<p class="tip">详见 <a href="/promo/rules">推广约定</a>。</p>';
  async function saveQr(url, filename){
    var r = await fetch(url, {credentials:'same-origin'});
    if (!r.ok) throw new Error('无法下载二维码');
    var b = await r.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
  if (d.dashboard){
    var x = d.dashboard, link = x.url || ('https://lvhanzhushou.com' + x.link);
    var refs = (x.referrals||[]).map(function(r){ return '<li>' + LH.esc(r.name) + ' · ' + LH.esc(r.joined||'') + (r.converted?' · 已付费':'') + '</li>'; }).join('');
    box.innerHTML = '<div class="card"><h2>我的推广</h2>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#E6F3F1;border-radius:12px;padding:8px 12px;margin:0 0 8px"><span style="font-size:14px;color:#4A5560">推广码</span><b style="font-size:28px;letter-spacing:3px;color:#146E68;font-family:ui-monospace,Menlo,Consolas,monospace">' + LH.esc(x.code) + '</b><button class="btn ghost" id="copycode" style="font-size:14px;white-space:nowrap">复制推广码</button></div>' +
      '<img src="/api/promo/qr.png" alt="旅韩助手推广二维码" style="display:block;width:100%;max-width:280px;margin:0 auto 8px;background:#fff">' +
      '<p class="tip" id="plink" style="word-break:break-all;font-size:14px;color:#1A2330">' + LH.esc(link) + '</p>' +
      '<div class="row"><button class="btn primary" id="saveqr">保存图片</button><button class="btn ghost" id="copy">复制链接</button></div>' +
      '<div class="chips" style="margin-top:14px"><span class="chip">访问 ' + x.visits + '</span><span class="chip">注册 ' + x.regs + '</span><span class="chip">付费笔数 ' + (x.paid_count!=null?x.paid_count:x.paid_conversions) + '</span></div>' +
      '<p style="margin-top:10px">已结算佣金 <b>¥' + x.paid + '</b> · 待结算佣金 <b>¥' + (x.unsettled!=null?x.unsettled:(Number(x.pending||0)+Number(x.payable||0))) + '</b></p>' +
      terms + '</div>' +
      '<div class="card"><h2>推荐用户（姓名已打码）</h2>' + (refs ? '<ul>' + refs + '</ul>' : '<p class="tip">还没有推荐注册。</p>') + '</div>';
    document.getElementById('copycode').onclick = function(){ if (navigator.clipboard) navigator.clipboard.writeText(x.code).then(function(){ show(ok,'已复制推广码'); }); else prompt('推广码', x.code); };
    document.getElementById('copy').onclick = function(){ if (navigator.clipboard) navigator.clipboard.writeText(link).then(function(){ show(ok,'已复制'); }); else prompt('推广链接', link); };
    document.getElementById('saveqr').onclick = function(){ saveQr('/api/promo/qr.png', '旅韩助手-推广码-' + x.code + '.png').then(function(){ show(ok,'已保存'); }).catch(function(e){ show(err,e.message); }); };
    return;
  }
  var app = d.application;
  if (app && app.status === 'pending'){
    box.innerHTML = '<div class="card"><b>申请审核中。</b><p class="tip">提交于 ' + LH.esc(app.time||'') + '。</p>' + terms + '</div>';
    return;
  }
  var rejected = (app && app.status === 'rejected') ? '<p>上次未通过：' + LH.esc(app.reject_reason||'') + '</p>' : '';
  var prevDy = (app && app.douyin_id) ? LH.esc(app.douyin_id) : '';
  var prevMethod = (app && app.promo_method) ? app.promo_method : '';
  var methodOpts = ['户外直播','短视频','社群','其他'].map(function(m){
    return '<option value="' + m + '"' + (prevMethod===m ? ' selected' : '') + '>' + m + '</option>';
  }).join('');
  box.innerHTML = '<div class="card"><h2>申请成为推广员</h2>' + rejected + terms +
    '<label class="f">抖音号<span style="color:#c62828"> *</span><input class="f" id="douyin" maxlength="40" required autocomplete="off" placeholder="请填写抖音号（2–40 个字）" value="' + prevDy + '"></label>' +
    '<label class="f">推广方式（选填）<select class="f" id="pmethod"><option value="">请选择（选填）</option>' + methodOpts + '</select></label>' +
    '<label class="f" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="agree"><span>我已阅读并同意<a href="/promo/rules">推广约定</a>（单层推荐、按实付 50% 计佣，禁止骚扰和虚假、医疗承诺）</span></label>' +
    '<textarea class="f" id="msg" maxlength="200" placeholder="选填：简单介绍你打算如何推广"></textarea>' +
    '<button class="btn primary block" id="sub">提交申请</button></div>';
  document.getElementById('sub').onclick = async function(){
    show(err,''); show(ok,'');
    var dy = (document.getElementById('douyin').value || '').trim();
    if (!dy){ show(err,'请填写抖音号'); return; }
    if (dy.length < 2 || dy.length > 40 || !/^[A-Za-z0-9_.\-\u4e00-\u9fff]{2,40}$/.test(dy)){
      show(err,'抖音号只能包含字母、数字、下划线、点、短横线和中文，长度 2–40 个字'); return;
    }
    this.disabled = true;
    try {
      var r = await LH.api('POST', '/api/promo/apply', {
        agree: document.getElementById('agree').checked,
        douyin_id: dy,
        promo_method: document.getElementById('pmethod').value,
        message: document.getElementById('msg').value
      });
      show(ok, r.message||'已提交'); location.reload();
    } catch(e){ show(err, e.message); this.disabled = false; }
  };
})();
</script>
<script src="/static/pwa.js?v=102" defer></script>
</body>
</html>
