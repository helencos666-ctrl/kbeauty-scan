<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅韩社区 · 旅韩助手</title>
<meta name="description" content="旅韩助手社区：韩国旅行踩坑经验、组团同行、签证经验、留学学校和交友讨论。">
<meta name="theme-color" content="#ff6b8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pwa.css">
<link rel="stylesheet" href="/static/community.css">
</head>
<body>
<header>
  <h1>💬 旅韩社区</h1>
  <p>真实的韩国旅行经验分享与讨论</p>
</header>
<main>
  <div class="card userbar" id="ub">加载中…</div>
  <div class="boards" id="boards"></div>
  <div class="warn" id="bwarn" style="display:none"></div>
  <div id="list"><div class="loading">加载中…</div></div>
  <div style="text-align:center;margin:6px 0 14px"><button class="btn ghost" id="more" style="display:none">加载更多</button></div>
  <div class="card" id="rules">
    <h2>📢 社区公告</h2>
    <ul class="rules">
      <li>严禁诈骗、违法违禁、虚假信息、签证代办宣传、违法医疗广告、色情、赌博和骚扰，违者删帖封号，费用不退。</li>
      <li>酒店住宿、租车包车、医美皮肤科信息请开通商家会员后在商家版块发布；普通版块的商业内容需审核。</li>
      <li>签证、留学版块仅为经验分享，本站不提供代办服务。</li>
    </ul>
    <a class="btn ghost block" href="/rules" style="margin-top:10px">查看完整发帖规则</a>
  </div>
  <div class="disclaimer">帖子内容为网友个人经验，仅供参考，不代表本站观点。</div>
  <div class="footlinks"><a href="/rules">社区公告与发帖规则</a>·<a href="/member">会员说明</a>·<a href="/community">社区首页</a></div>
</main>
<a class="fab" href="/community/new" id="fab">✏️ 发帖</a>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/attractions"><i>🗺️</i>景点</a>
  <a href="/tips"><i>📘</i>攻略</a>
  <a href="/community" class="on"><i>💬</i>社区</a>
  <a href="/member"><i>👑</i>会员</a>
</nav>
<script src="/static/community.js"></script>
<script>
var BOARDS = [['','全部'],['pit','踩坑经验'],['group','组团同行'],['visa','签证经验'],['study','留学学校'],['friends','交友'],['hotel','🏨 酒店住宿'],['car','🚗 租车包车'],['clinic','🏥 医美皮肤科']];
var WARN = {
  visa: '⚠️ 签证版块仅为网友个人经验分享，本站不提供签证代办。政策以韩国驻华使领馆、韩国签证申请中心和 K-ETA 官网为准。',
  study: '⚠️ 留学版块仅为网友经验与学校信息交流，本站不提供留学中介或代办服务。招生信息以学校官网为准。',
  friends: '⚠️ 交友请注意安全：不要转账借钱，不要透露证件和住址，线下见面选公共场所。遇到可疑账号请举报。',
  group: '⚠️ 组团同行请自行核实对方身份，费用 AA 透明，谨防以拼团为名收取定金的骗局。',
  hotel: '🏨 商家信息由商家自行发布并负责，本站不担保其资质、价格和服务。预订前请核实营业登记，使用正规支付并保留凭证。',
  car: '🚗 商家信息由商家自行发布并负责。租车包车请确认对方具备租赁或客运资质和保险，费用当面确认，谨慎预付。',
  clinic: '🏥 商家信息由商家自行发布并负责，本站不担保医疗效果。请选择合法医疗机构，遵医嘱，谨慎对待“包效果”类宣传。',
};
var cur = LH.qs('board') || '', last = 0;
if (!BOARDS.some(function(b){ return b[0] === cur; })) cur = '';
function renderBoards(){
  document.getElementById('boards').innerHTML = BOARDS.map(function(b){
    return '<button data-b="' + b[0] + '"' + (b[0] === cur ? ' class="on"' : '') + '>' + b[1] + '</button>';
  }).join('');
  document.querySelectorAll('#boards button').forEach(function(btn){
    btn.onclick = function(){ cur = btn.dataset.b; history.replaceState(null, '', cur ? '?board=' + cur : '/community'); renderBoards(); load(true); };
  });
  var w = document.getElementById('bwarn'); w.textContent = WARN[cur] || ''; w.style.display = WARN[cur] ? 'block' : 'none';
  document.getElementById('fab').href = '/community/new' + (cur ? '?board=' + cur : '');
}
function item(p){
  var cover = p.cover ? '<img class="cover" loading="lazy" alt="" src="/api/community/img/' + p.cover + '?t=1">' : '';
  return '<a class="post" href="/community/post/' + p.id + '"><div class="txt"><h3>' + LH.esc(p.title) + '</h3>' +
    '<p class="ex">' + LH.esc(p.excerpt) + '</p><div class="meta">' + (p.merchant ? '<span class="tag biz">商家</span>' : '') + '<span class="tag">' + LH.esc(p.board_name) + '</span>' +
    '<span>' + LH.esc(p.author) + LH.badge(p.author_tier) + '</span><span>' + LH.esc(p.time) + '</span>' +
    '<span>❤️ ' + p.likes + '</span><span>💬 ' + p.comments + '</span>' + (p.img_n > 1 ? '<span>🖼 ' + p.img_n + '</span>' : '') +
    '</div></div>' + cover + '</a>';
}
async function load(reset){
  var list = document.getElementById('list'), more = document.getElementById('more');
  if (reset){ last = 0; list.innerHTML = '<div class="loading">加载中…</div>'; }
  try {
    var d = await LH.api('GET', '/api/community/posts?board=' + cur + (last ? '&before=' + last : ''));
    if (reset) list.innerHTML = '';
    if (d.tier_required){ list.innerHTML = d.login_required ? '<div class="card empty">交友版需登录并开通会员（¥9.9）后查看<br><br><a class="btn primary" href="/login?next=/community%3Fboard%3Dfriends">登录 / 注册</a></div>' : '<div class="card empty">交友版需开通会员（¥9.9）后查看<br><br><a class="btn primary" href="/member">了解会员</a></div>'; more.style.display = 'none'; return; }
    if (!d.posts.length && reset){ list.innerHTML = '<div class="card empty">这里还没有帖子，来发第一篇吧</div>'; }
    list.insertAdjacentHTML('beforeend', d.posts.map(item).join(''));
    if (d.posts.length) last = d.posts[d.posts.length - 1].id;
    more.style.display = d.more ? 'inline-block' : 'none';
  } catch(e){ list.innerHTML = '<div class="card empty">' + LH.esc(e.message) + '</div>'; }
}
document.getElementById('more').onclick = function(){ load(false); };
renderBoards(); load(true); LH.userbar(document.getElementById('ub'));
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
