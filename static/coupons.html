<body>

  <p>优惠券仅作展示，付款仍通过网站收款码由人工开通</p>
</header>
<main>
  <div class="card" id="box">加载中…</div>
  <div class="card">
    <h2>使用说明</h2>
    <p style="margin:0;line-height:1.7;font-size:15px">新人注册会自动获得一张「新人券 立减¥9.9」，有效期 30 天。适用范围暂为「会员开通（待定）」。付款仍请扫网站会员页的收款码，金额不变；开通时把券的信息告知管理员，由人工抵扣。不会在线自动扣款。</p>
    <p class="tip">请注意：若把 ¥9.9 新人券用于 ¥9.9 会员档，抵扣后该档相当于免费，需人工确认。</p>
  </div>

<script src="/static/community.js?v=73"></script>

<script>
(async function(){
  var d = await LH.userbar();
  var box = document.getElementById('box');
  if (!d || !d.user){
    box.innerHTML = '<h2>卡券</h2><p>登录后即可查看你的卡券。</p><a class="btn primary block" href="/login?next=/coupons">免费注册 / 登录</a>';
    return;
  }
  try {
    var r = await LH.api('GET', '/api/coupons');
    var list = r.coupons || [];
    if (!list.length){ box.innerHTML = '<h2>卡券</h2><div class="empty">暂时没有卡券</div>'; return; }
    var ST = {available:'可使用', used:'已使用', expired:'已过期'};
    box.innerHTML = '<h2>卡券</h2>' + list.map(function(c){
      var amt = c.kind==='subway_guide_card' ? '' : (' <b style="color:var(--primary)">¥' + LH.esc(c.amount) + '</b>');
      var exp = c.expires_at ? ('<span>有效期至 ' + LH.esc(c.expires_at) + '</span>') : '<span>长期有效</span>';
      var link = c.href ? ('<a class="btn sm primary" href="' + LH.esc(c.href) + '">打开地铁攻略</a>') : '';
      return '<div class="cmt"><div class="who">' + LH.esc(c.title) + amt + '</div>' +
        '<div class="meta"><span class="tag">' + LH.esc(ST[c.status]||c.status) + '</span>' + exp + '</div>' +
        '<p class="tip" style="margin:8px 0 0">' + LH.esc(c.scope_note) + '<br>' + LH.esc(c.flag||'') + '</p>' + link + '</div>';
    }).join('');
  } catch(e){ box.innerHTML = '<p>' + LH.esc(e.message) + '</p>'; }
})();
</script>

<script src="/static/pwa.js?v=73" defer></script>
</body>
</html>
