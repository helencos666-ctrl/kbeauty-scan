<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>私信 · 旅韩助手</title>
<meta name="description" content="韩友圈私信。">
<meta name="theme-color" content="#ff6b8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pwa.css">
<link rel="stylesheet" href="/static/community.css">
<meta name="robots" content="noindex">
</head>
<header style="padding-bottom:24px">
  <h1 id="h1">💬 私信</h1>
  <p><a href="/community/messages">‹ 全部私信</a> <span id="hlinks"></span></p>
</header>
<main style="padding-bottom:70px">
  <div class="antiscam" id="anti"></div>
  <div class="err" id="err"></div>
  <div class="msgs" id="msgs"><div class="loading">加载中…</div></div>
</main>
<div class="sendbar" id="sb" style="display:none"><textarea id="txt" maxlength="500" placeholder="友善聊天，不谈转账和投资"></textarea><button class="btn primary" id="send">发送</button></div>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/attractions"><i>🗺️</i>景点</a>
  <a href="/tips"><i>📘</i>攻略</a>
  <a href="/community" class="on"><i>💬</i>社区</a>
  <a href="/member"><i>👑</i>会员</a>
</nav>
<script src="/static/community.js"></script>
<script>
document.getElementById('anti').textContent = LH.ANTISCAM;
var tid = parseInt(location.pathname.split('/').pop(), 10), E = LH.esc, T = null, SB = document.getElementById('sb').innerHTML;
async function load(){
  try { T = await LH.api('GET', '/api/friends/threads/' + tid); }
  catch(e){
    document.getElementById('msgs').innerHTML = '<div class="card empty">' + E(e.message) + (e.status === 401 ? '<br><br><a class="btn primary" href="/login?next=' + encodeURIComponent(location.pathname) + '">登录</a>' : '') + '</div>';
    return;
  }
  document.getElementById('h1').innerHTML = '<span class="chat-hd">' + LH.avatar(T.other, T.nickname, T.has_avatar, 'lg', T.cover ? ('/api/friends/photo/' + T.cover + '?t=1') : '') + '<span>' + E(T.nickname) + LH.vb(T.verified) + '</span></span>';
  document.getElementById('hlinks').innerHTML = (T.has_profile ? ' · <a href="/community/friends/' + T.other + '">查看资料</a>' : '') +
    ' · <a href="#" id="blk">' + (T.blocked ? '解除拉黑' : '拉黑') + '</a>';
  document.getElementById('blk').onclick = async function(ev){
    ev.preventDefault();
    if (!T.blocked && !confirm('拉黑后对方不能再给你发消息，确定？')) return;
    try { await LH.api('POST', '/api/friends/block/' + T.other, {}); load(); } catch(e){ alert(e.message); }
  };
  var el = document.getElementById('msgs');
  el.innerHTML = T.messages.map(function(m){
    return '<div class="msg' + (m.mine ? ' me' : '') + (m.flagged ? ' flag' : '') + '">' + (m.kind === 'greet' ? '👋 ' : '') + E(m.body) +
      (m.flagged ? '<span class="fw">⚠️ ' + (m.mine ? '这条消息含转账/投资等敏感词，已提醒对方并通知管理员' : '这条消息含转账/投资等敏感词。交友不谈钱，对方要钱一律是骗子，请勿转账并点“举报”') + '</span>' : '') +
      '<span class="mt">' + E(m.time) + (m.mine ? (m.read ? ' · 已读' : ' · 未读') : ' · <a href="#" data-rp="' + m.id + '" style="color:var(--sub)">举报</a>') + '</span></div>';
  }).join('') || '<div class="empty">还没有消息</div>';
  el.querySelectorAll('[data-rp]').forEach(function(a){ a.onclick = function(ev){ ev.preventDefault(); LH.report('message', +a.dataset.rp); }; });
  var sb = document.getElementById('sb');
  sb.style.display = 'flex';
  if (T.can_send && !document.getElementById('send')){ sb.innerHTML = SB; bindSend(); }
  if (!T.can_send){
    sb.innerHTML = T.my_tier < 2 ? '<a class="btn primary" style="flex:1" href="/member">开通高级会员后可回复私信</a>' :
      '<button class="btn gray" style="flex:1" disabled>' + (T.blocked ? '你已拉黑对方' : (T.banned ? '对方账号已被封禁' : '对方暂不接收你的消息')) + '</button>';
  }
  window.scrollTo(0, document.body.scrollHeight);
}
function bindSend(){ document.getElementById('send').onclick = sendMsg; }
async function sendMsg(){
  var t = document.getElementById('txt').value.trim(); if (!t) return;
  this.disabled = true; LH.showErr(document.getElementById('err'), '');
  try { var r = await LH.api('POST', '/api/friends/threads/' + tid + '/messages', {body: t}); document.getElementById('txt').value = ''; if (r.warning) alert(r.warning); await load(); }
  catch(e){ LH.showErr(document.getElementById('err'), e.message); }
  this.disabled = false;
}
bindSend();
load();
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
