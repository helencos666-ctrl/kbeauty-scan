<script>
(async function(){
  var box = document.getElementById('box');
  var me = null;
  try { me = await LH.me(); } catch(e){ box.innerHTML = '<div class="empty">' + LH.esc(e.message) + '</div>'; return; }

    location.replace('/community/new?listing=1');
    return;
  }
  location.replace('/partner?from=start');
})();
</script>
