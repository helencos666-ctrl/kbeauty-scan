<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>绑定手机号 · 旅韩助手</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=99">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=99">
<link rel="stylesheet" href="/static/pwa.css?v=99">
<link rel="stylesheet" href="/static/community.css?v=99">
</head>
<body>
<header>
  <h1>📱 绑定手机号</h1>
  <p id="sub">用短信验证码确认是你本人，30 秒搞定</p>
</header>
<main>
  <div class="card" id="boxUnbound" hidden>
    <div class="err" id="err"></div>
    <div id="why" style="font-size:14px;line-height:1.8;color:#1A2330;margin-bottom:4px">
      <b>为什么要绑定？</b><br>
      · 防止机器人和小号刷帖、刷推广佣金<br>
      · 账号被盗或忘记密码时，能证明是你本人<br>
      · 手机号只用于登录和安全验证，<b>不会公开显示</b>
    </div>
    <div id="poBox"></div>
    <button class="btn primary block" id="go" style="margin-top:16px">验证并绑定</button>
    <p class="tip" id="soft"><a href="#" id="later" style="color:#2c7be5">以后再说</a>　·　绑定后可用手机号登录</p>
    <p class="tip" id="hard" hidden>为保护社区，需要先绑定手机号才能发帖、评论和私信；浏览不受影响。</p>
  </div>
  <div class="card" id="boxDone" hidden>
    <p style="font-size:16px;margin:4px 0"><b>✅ 已绑定</b>　<span id="maskedNo"></span></p>
    <a class="btn primary block" id="goNext" href="/me" style="margin-top:12px">继续使用</a>
  </div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7"><a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/terms" style="color:#2c7be5">用户协议</a></p>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=99"></script>
<script src="/static/phone-otp.js?v=1"></script>
<script>
var next = LH.qs('next') || '/me';
if (!/^\/(?![\/\\])/.test(next)) next = '/me';
var errEl = document.getElementById('err');
function done(masked){
  document.getElementById('boxUnbound').hidden = true;
  document.getElementById('boxDone').hidden = false;
  document.getElementById('maskedNo').textContent = masked || '';
  document.getElementById('goNext').href = next;
}
(async function(){
  var me;
  try { me = await LH.api('GET', '/api/community/me'); } catch(e){ me = {}; }
  if (!me.user){ location.href = '/login?next=' + encodeURIComponent('/phone-bind?next=' + next); return; }
  var ph = me.user.phone || {};
  if (ph.verified){ done(ph.masked); return; }
  document.getElementById('boxUnbound').hidden = false;
  if (ph.required_now){
    document.getElementById('soft').hidden = true; document.getElementById('hard').hidden = false;
  } else if (ph.days_left != null){
    document.getElementById('sub').textContent = '请在 ' + ph.enforce_from + ' 前完成绑定（还剩 ' + ph.days_left + ' 天）';
  }
  var w = PhoneOtp.mount(document.getElementById('poBox'), {purpose: 'bind', onError: function(m){ LH.showErr(errEl, m); }});
  document.getElementById('later').onclick = function(e){
    e.preventDefault();
    try { localStorage.setItem('lh_phone_prompt', String(Date.now())); } catch(_){}
    location.href = next;
  };
  document.getElementById('go').onclick = async function(){
    LH.showErr(errEl, '');
    var v = w.values();
    if (!v.phone.trim()){ LH.showErr(errEl, '请输入手机号'); return; }
    if (!v.code.trim()){ LH.showErr(errEl, '请输入短信验证码'); return; }
    this.disabled = true;
    try { var r = await LH.api('POST', '/api/community/phone/bind', {country: v.country, phone: v.phone, code: v.code}); done(r.phone); }
    catch(e){ LH.showErr(errEl, e.message); this.disabled = false; }
  };
})();
</script>
<script src="/static/pwa.js?v=99" defer></script>
</body>
</html>
