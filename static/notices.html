<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>通知 · 旅韩助手</title>
<meta name="description" content="韩友圈通知：评论、点赞、关注、加精和徽章。">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=74">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=74">
<link rel="stylesheet" href="/static/pwa.css?v=74">
<link rel="stylesheet" href="/static/community.css?v=74">
<meta name="robots" content="noindex">
</head>
<body>
<header style="padding-bottom:24px">
  <h1>🔔 通知</h1>
  <p><a href="/community">‹ 韩友圈</a></p>
</header>
<main style="padding-bottom:70px">
  <div class="card" id="box"><div class="loading">加载中…</div></div>
  <div style="text-align:center"><button class="btn ghost" id="more" style="display:none">加载更多</button></div>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=74"></script>
<script>
var IC = {comment: '💬', reply: '↩️', like: '❤️', follow: '👤', featured: '🌟', pinned: '📌', badge: '🏅'}, last = 0, E = LH.esc;
async function load(){
  var box = document.getElementById('box'), d;
  try { d = await LH.api('GET', '/api/notifications' + (last ? '?before=' + last : '')); }
  catch(e){ box.innerHTML = '<div class="empty">' + (e.status === 401 ? '请先登录<br><br><a class="btn primary" href="/login?next=/community/notices">登录 / 注册</a>' : E(e.message)) + '</div>'; return; }
  var html = d.items.map(function(n){
    return '<a class="ntf' + (n.unread ? ' un' : '') + '" href="' + E(n.link || '#') + '"><i>' + (IC[n.kind] || '🔔') + '</i><span class="tx">' + E(n.text) + '<small>' + E(n.time) + '</small></span></a>';
  }).join('');
  if (!last) box.innerHTML = html || '<div class="empty">还没有通知。发帖、评论后，有人回复或点赞会在这里提醒你。</div>';
  else box.insertAdjacentHTML('beforeend', html);
  if (d.items.length) last = d.items[d.items.length - 1].id;
  document.getElementById('more').style.display = d.more ? 'inline-block' : 'none';
}
document.getElementById('more').onclick = load;
load();
</script>
<script src="/static/pwa.js?v=74" defer></script>
</body>
</html>
