  function expiredOf(p){ return !!(p.expired || (p.dazi && p.dazi.expired)); }

  function cardHtml(p){
    var d = p.dazi || {};
    var exp = expiredOf(p);
    var tags = '';
    if (p.pinned) tags += '<span class="dz-tag pin">置顶</span>';
    if (p.is_biz) tags += '<span class="dz-tag biz">商家</span>';
    if (p.biz_verified) tags += '<span class="dz-tag ok">✔ 已认证</span>';
    if (p.author_official) tags += '<span class="dz-tag off">官方</span>';
    if (d.kind_name) tags += '<span class="dz-tag">' + esc(d.kind_name) + '</span>';
    if (d.city_name) tags += '<span class="dz-tag">' + esc(d.city_name) + '</span>';
    if (d.gender === 'female') tags += '<span class="dz-tag fem">' + esc(d.gender_name || '仅限女生') + '</span>';
    else if (d.gender === 'male') tags += '<span class="dz-tag male">' + esc(d.gender_name || '仅限男生') + '</span>';
    if (exp) tags += '<span class="dz-tag exp">已过期</span>';

    var dateLine = '';
    if (d.date_from || d.date_to){
      var txt = '📅 ' + (d.date_from ? fmtMD(d.date_from) : '');
      if (d.date_to) txt += '–' + fmtMD(d.date_to);
      if (d.people) txt += ' · 👥 ' + d.people + '人';
      dateLine = '<div class="dz-date">' + esc(txt) + '</div>';
    } else if (d.people){
      dateLine = '<div class="dz-date">👥 ' + esc(d.people) + '人</div>';
    }

    var cover = p.cover
      ? '<img class="dz-cover" loading="lazy" decoding="async" alt="" data-hideonerr="1" src="/api/community/img/' + encodeURIComponent(p.cover) + '?t=1">'
      : '';

    return '<a class="dz-card' + (exp ? ' exp' : '') + '" href="/community/post/' + encodeURIComponent(p.id) + '" data-id="' + esc(p.id) + '" data-uid="' + esc(p.author_id) + '">' +
      (tags ? '<div class="dz-tags">' + tags + '</div>' : '') +
      '<div class="dz-main"><div class="dz-txt">' +
        '<h3 class="dz-title">' + esc(p.title || '') + '</h3>' +
        dateLine +
        (p.excerpt ? '<p class="dz-ex">' + esc(p.excerpt) + '</p>' : '') +
      '</div>' + cover + '</div>' +
      '<div class="dz-foot">' +
        '<span class="dz-au">' + LH.avatar(p.author_id, p.author, p.has_avatar, 'sm') +
          '<span class="dz-nick">' + esc(p.author || '匿名') + '</span>' +
          '<span class="dz-time">' + esc(LH.relTime(p.time)) + '</span></span>' +
        '<span class="dz-acts">' +
          '<button type="button" class="dz-msg" data-id="' + esc(p.id) + '" data-biz="' + (p.is_biz ? '1' : '0') + '">' + (p.is_biz ? '咨询' : '私信') + '</button>' +
          '<button type="button" class="dz-more" data-id="' + esc(p.id) + '" data-uid="' + esc(p.author_id) + '">···</button>' +
        '</span>' +
      '</div></a>';
  }

  async function load(reset){
    if (loading && !reset) return;
    loading = true;
    var my = ++seq;
    var list = $('#list');
    if (reset){
      state.offset = 0;
      list.innerHTML = LH.skel(3);
      $('#moreBtn').hidden = true;
    }
    var q = new URLSearchParams();
    q.set('tab', state.tab);
    q.set('city', state.city || '');
    q.set('kind', state.kind || '');
    q.set('date', state.date || '');
    q.set('gender', state.gender || '');
    q.set('kw', state.kw || '');
    q.set('offset', String(state.offset || 0));
    q.set('limit_n', '20');
    try {
      var d = await LH.api('GET', '/api/dazi/posts?' + q.toString());
      if (my !== seq) return;
      renderList(d || {}, reset);
    } catch(e){
      if (my !== seq) return;
      var msg = (e && e.message) || optErr || '加载失败，请稍后重试';
      if (reset){
        list.innerHTML = '<div class="empty">' + esc(msg) + '</div>';
      } else {
        LH.toast(msg);
      }
      $('#moreBtn').hidden = true;
    } finally {
      if (my === seq) loading = false;
    }
  }

  function renderList(d, reset){
    var posts = d.posts || [];
    var list = $('#list');
    if (reset){
      var html = '';
      if (state.tab === 'personal'){
        html += '<div class="dz-tip">想找中介办团签/包车/地陪？看看 <a href="#" data-go-merchant>商家服务</a></div>';
      }
      if (!posts.length){
        html += '<div class="empty">还没有符合条件的帖子，<a href="#" id="emptyNew">发第一条找搭子</a></div>';
        list.innerHTML = html;
        $('#moreBtn').hidden = true;
        return;
      }
      list.innerHTML = html + posts.map(cardHtml).join('');
    } else if (posts.length){
      list.insertAdjacentHTML('beforeend', posts.map(cardHtml).join(''));
    }
    var nx = (d.next_offset === 0 || d.next_offset) ? +d.next_offset : (state.offset + posts.length);
    state.offset = isNaN(nx) ? state.offset + posts.length : nx;
    $('#moreBtn').hidden = !d.more;
  }

  /* ---------- 返回时恢复列表和滚动位置（v99） ----------
     进帖子详情/私信前把当前列表、页码、滚动位置存进 sessionStorage；后退回来直接画出来并滚回原处，不重新加载、不跳回顶部。 */
  var LKEY = 'lh_dazi_list_v1';
  function saveList(){
    try {
      var list = $('#list');
      if (!list || !list.querySelector('.dz-card')) return;
      sessionStorage.setItem(LKEY, JSON.stringify({q: location.search, path: location.pathname, html: list.innerHTML,
        offset: state.offset, more: !$('#moreBtn').hidden, y: window.scrollY, t: Date.now()}));
    } catch(e){}
  }
  function restoreList(){
    try {
      var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
      var back = nav.type === 'back_forward' || sessionStorage.getItem('lh_back') === '1';
      sessionStorage.removeItem('lh_back');
      if (!back) return false;
      var c = JSON.parse(sessionStorage.getItem(LKEY) || 'null');
      if (!c || c.q !== location.search || c.path !== location.pathname || Date.now() - c.t > 30 * 60 * 1000) return false;
      $('#list').innerHTML = c.html;
      state.offset = c.offset || 0;
      $('#moreBtn').hidden = !c.more;
      var y = c.y || 0;
      window.scrollTo(0, y);
      requestAnimationFrame(function(){ window.scrollTo(0, y); setTimeout(function(){ if (Math.abs(window.scrollY - y) > 40) window.scrollTo(0, y); }, 60); });
      return true;
    } catch(e){ return false; }
  }
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch(e){}
  window.addEventListener('pagehide', saveList);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) saveList(); });

  async function runCheck(){
    var title = $('#cTitle').value.trim();
    var body = $('#cBody').value.trim();
    var text = title + '\n' + body;
    if (text.replace(/\s/g, '').length < 4){ showWarn(''); return; }
    var my = ++checkSeq;
    try {
      var r = await LH.api('POST', '/api/dazi/check', {text: text});
      if (my !== checkSeq) return;
      if (r && r.ok === false){
        var hits = (r.hits || []).join('、');
        showWarn('检测到站外联系方式' + (hits ? '（' + hits + '）' : '') + '，发布会被拦截，请删掉，大家会通过站内私信找你');
      } else {
        showWarn('');
      }
    } catch(e){ /* 检测失败不打扰用户 */ }
  }
  function scheduleCheck(){

  function cpValidate(){
    if (!cp.city) return '请选择城市';
    if (!cp.kind) return '请选择类型';
    var from = $('#cFrom').value;
    if (!from) return '请选择开始日期';
    var to = $('#cTo').value;
    if (to && from && to < from) return '结束日期不能早于开始日期';
    var ppl = String($('#cPeople').value || '').trim();
    if (ppl){ var n = Number(ppl); if (!(n >= 1 && n <= 20)) return '人数请填 1-20 之间的数字'; }
    var title = $('#cTitle').value.trim();
    if (title.length < 4 || title.length > 40) return '标题请填 4-40 个字';
    var body = $('#cBody').value.trim();
    if (body.length < 10 || body.length > 3000) return '正文请填 10-3000 个字';
    return '';
  }
  async function submitComposer(){

      fd.append('gender', cp.gender || 'any');

      var sentType = cp.ptype === 'merchant' ? 'merchant' : 'personal';
      var r = await LH.api('POST', '/api/dazi/posts', fd);

      syncAll();
      load(true);

      showErrBox($('#cErr'), e.message || '发布失败，请稍后再试', !!(e && e.status === 403 && /会员/.test(e.message || '')));

      btn.disabled = false;

    $('#safeBar').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); this.click(); }
    });

    $('#tabs').addEventListener('click', function(ev){
      var b = ev.target.closest('button[data-tab]');
      if (!b) return;
      var tab = b.getAttribute('data-tab');
      if (tab === state.tab){ onFilterChange(); return; }
      setTab(tab);
    });

    $('#hotWords').addEventListener('click', function(ev){
      var b = ev.target.closest('button[data-idx]');
      if (!b) return;
      var idx = +b.getAttribute('data-idx');
      var hw = (opts.hot_words || [])[idx];
      if (!hw) return;
      if (hotSel === idx){
        hotSel = null;
        state.city = ''; state.kind = ''; state.gender = ''; state.kw = '';
      } else {
        hotSel = idx;
        state.city = hw.city || '';
        state.kind = hw.kind || '';
        state.gender = hw.gender || '';
        state.kw = hw.w || '';
      }
      state.offset = 0;
      writeUrl();
      syncAll();
      load(true);
    });

    $('#fCity').addEventListener('click', function(ev){
      var b = ev.target.closest('button[data-val]');
      if (!b) return;
      state.city = b.getAttribute('data-val') || '';
      hotSel = null;
      onFilterChange();
    });
    $('#fKind').addEventListener('click', function(ev){
      var b = ev.target.closest('button[data-val]');
      if (!b) return;
      state.kind = b.getAttribute('data-val') || '';
      hotSel = null;
      onFilterChange();
    });
    $('#fDate').addEventListener('change', function(){
      state.date = this.value || '';
      hotSel = null;
      onFilterChange();
    });
    $('#fGender').addEventListener('change', function(){
      state.gender = this.value || '';
      hotSel = null;
      onFilterChange();
    });
    function applyKw(){
      var v = $('#fKw').value.trim();
      if (v === state.kw) return;
      state.kw = v;
      hotSel = null;
      onFilterChange();
    }
    $('#fKw').addEventListener('input', function(){
      clearTimeout(kwTimer);
      kwTimer = setTimeout(applyKw, 400);
    });
    $('#fKw').addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); clearTimeout(kwTimer); applyKw(); }
    });

    $('#moreBtn').addEventListener('click', function(){
      if (loading) return;
      load(false);
    });

    $('#list').addEventListener('click', function(ev){
      var t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest('a.dz-card') && !t.closest('button')) saveList();
      var goM = t.closest('[data-go-merchant]');
      if (goM){ ev.preventDefault(); setTab('merchant'); return; }
      var empty = t.closest('#emptyNew');
      if (empty){ ev.preventDefault(); openComposer(); return; }
      var msg = t.closest('.dz-msg');
      if (msg){
        ev.preventDefault(); ev.stopPropagation();
        startChat(msg.getAttribute('data-id'), msg.getAttribute('data-biz') === '1');
        return;
      }
      var more = t.closest('.dz-more');
      if (more){
        ev.preventDefault(); ev.stopPropagation();
        openSheet(more.getAttribute('data-id'), more.getAttribute('data-uid'));
        return;
      }
    });

    $('#sheet').addEventListener('click', function(ev){
      var b = ev.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'cancel' || act === 'back'){ closeSheet(); return; }
      if (act === 'report'){ renderReport(); return; }
      if (act === 'block'){ doBlock(sheetUid); return; }
      if (act === 'rp-submit'){ submitReport(); return; }
    });

    $('#composer').addEventListener('click', function(ev){
      var t = ev.target;
      if (!t || !t.closest) return;
      var chip = t.closest('.cchip');
      if (chip){
        var box = chip.closest('.cchips');
        var field = box ? box.getAttribute('data-field') : '';
        var val = chip.getAttribute('data-val') || '';
        if (!field) return;
        if (field === 'gender' || field === 'ptype'){
          cp[field] = val;
        } else {
          cp[field] = (cp[field] === val) ? '' : val;
        }
        syncAll();
        return;
      }
      var del = t.closest('#cPreviews .del');
      if (del){
        var i = +del.getAttribute('data-i');
        var it = cpImgs[i];
        if (it){ try { URL.revokeObjectURL(it.url); } catch(e){} }
        cpImgs.splice(i, 1);
        renderPreviews();
      }
    });

    $('#cClose').addEventListener('click', closeComposer);
    $('#cImgs').addEventListener('change', async function(){
      var files = Array.prototype.slice.call(this.files || []);
      this.value = '';
      for (var i = 0; i < files.length; i++){
        if (cpImgs.length >= 6){ LH.toast('图片上限 6 张'); break; }
        try {
          var f = await LH.compress(files[i]);
          cpImgs.push({file: f, url: URL.createObjectURL(f)});
        } catch(e){ LH.toast(e.message || '有图片处理失败，请重试'); }
      }
      renderPreviews();
    });
    $('#cTitle').addEventListener('input', scheduleCheck);
    $('#cBody').addEventListener('input', scheduleCheck);
    $('#cFrom').addEventListener('change', function(){
      $('#cTo').min = this.value || todayISO();
      if ($('#cTo').value && this.value && $('#cTo').value < this.value) $('#cTo').value = '';
      showErrBox($('#cErr'), '');
    });
    $('#cSubmit').addEventListener('click', submitComposer);

    document.addEventListener('keydown', function(ev){
      if (ev.key !== 'Escape') return;
      if ($('#sheet').classList.contains('open')) closeSheet();
      else if ($('#composer').classList.contains('open')) closeComposer();
    });
  }

  /* ---------- 启动 ---------- */
  async function init(){
    readUrl();
    bind();
    renderFilters();
    buildComposerChips();
    syncAll();
    // 列表、登录状态、选项三个请求同时发（以前是一个等一个）；后退回来时直接用缓存的列表
    var restored = restoreList();
    var listP = restored ? Promise.resolve() : load(true);
    var meP = LH.me().then(function(d){ me = (d && d.user) || null; }, function(){ me = null; });
    try {
      var o = await LH.api('GET', '/api/dazi/options');
      if (o && typeof o === 'object'){
        ['cities', 'kinds', 'genders', 'hot_words', 'safety_tips', 'report_reasons'].forEach(function(k){
          if (Array.isArray(o[k]) && o[k].length) opts[k] = o[k];
        });
        if (typeof o.notice === 'string' && o.notice) opts.notice = o.notice;
      }
    } catch(e){
      optErr = e.message || '';
    }
    renderFilters();
    buildComposerChips();
    syncAll();
    await meP;
    await listP;
    if (location.pathname.replace(/\/+$/, '') === '/dazi/new') openComposer();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
<script src="/static/pwa.js?v=99" defer></script>
</body>
</html>
