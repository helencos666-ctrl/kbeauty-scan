<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>帖子详情 · 旅韩助手</title>
<meta name="description" content="旅韩助手社区帖子">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=92">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=92">
<link rel="stylesheet" href="/static/pwa.css?v=92">
<link rel="stylesheet" href="/static/community.css?v=92">
<link rel="stylesheet" href="/static/chat.css?v=92">
</head>
<body class="post-page no-hero">
<a class="pback" href="/community" aria-label="返回">‹</a>
<main>
  <div id="hero"></div>
  <div class="pwrap">
  <div id="warn"></div>
  <div id="post"><div class="loading">加载中…</div></div>
  <div id="cbox" style="display:none">
    <h2 id="ctitle">评论</h2>
    <div id="clist"></div>
    <div id="cform" style="margin-top:10px"></div>
  </div>
  <div class="disclaimer">帖子内容为网友个人经验，仅供参考，不代表本站观点。商家信息由商家自行负责。</div>
  <div class="footlinks"><a href="/rules">社区约定</a>·<a href="/member">会员说明</a>·<a href="/community">社区首页</a></div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">旅韩助手为个人运营的免费信息网站，内容仅供参考，不是旅行社，不代办签证。<br><a href="/terms" style="color:#2c7be5">用户协议与免责声明</a> · <a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/rules" style="color:#2c7be5">社区约定</a></p>
  </div>
</main>
<div class="pbar" id="pbar" hidden>
  <button type="button" class="pbar-in" id="pbarTalk">说点什么...</button>
  <button type="button" class="pact" id="like" aria-label="点赞">♡<small id="likeN">0</small></button>
  <button type="button" class="pact" id="fav" aria-label="收藏">☆<small id="favN">0</small></button>
  <button type="button" class="pact" id="cmtBtn" aria-label="评论">💬<small id="cmtN">0</small></button>
</div>
<div class="lightbox" id="lb"><img alt=""></div>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=92"></script>
<script>
var pid = parseInt(location.pathname.split('/').pop(), 10);
var WARN = {visa: '⚠️ 本帖为网友个人签证经验，本站不提供签证代办。政策以韩国驻华使领馆、韩国签证申请中心和 K-ETA 官网为准。',
  study: '⚠️ 本帖为网友留学经验分享，本站不提供留学中介或代办服务，招生信息以学校官网为准。',
  friends: '⚠️ 交友请注意安全：不要转账借钱，不要透露证件和住址，线下见面选公共场所。',
  group: '⚠️ 结伴同行请自行核实对方身份，费用 AA 透明，谨防收定金骗局。',
  hotel: '🏨 商家信息由商家自行发布并负责，本站不担保其资质、价格和服务。预订前请核实营业登记，使用正规支付并保留凭证。',
  car: '🚗 商家信息由商家自行发布并负责。租车包车请确认对方具备租赁或客运资质和保险，费用当面确认，谨慎预付。',
  clinic: '🏥 商家信息由商家自行发布并负责，本站不担保医疗效果。请选择合法医疗机构，遵医嘱，谨慎对待“包效果”类宣传。',
  agency: '🏫 机构信息由商家自行发布并负责，本站不提供留学中介服务。请核实机构资质，学校和签证信息以学校官网、使领馆为准，签合同前看清退费条款。',
  daigou: '🛍️ 代购信息由商家自行发布并负责。请确认商品来源和价格，尽量使用有交易保障的支付方式，注意入境免税额度和海关规定。',
  guide: '🙋 地陪信息由商家自行发布并负责。在韩国为外国游客提供有偿导游服务通常需要相应资质，请事先确认身份、价格和服务内容，谨慎预付。',
  kpop: '🎤 活动信息由发布者负责，请以主办方、经纪公司和正规售票平台公告为准。不要购买黄牛票或向个人预付抢票费用。',
  logistics: '📦 物流信息由商家自行发布并负责。请确认运费、时效、保价和清关责任，违禁品不得寄递，谨慎预付全款并保留单号凭证。',
};
var lb = document.getElementById('lb');
lb.onclick = function(){ lb.style.display = 'none'; };
function zoom(src){ lb.querySelector('img').src = src; lb.style.display = 'flex'; }
function topicList(p){
  var ts = [];
  String(p.topics || '').split(/\s+/).forEach(function(t){ if (t && ts.indexOf(t) < 0) ts.push(t); });
  (String(p.body || '').match(/#([^\s#]{1,20})/g) || []).forEach(function(h){
    var t = h.slice(1); if (t && ts.indexOf(t) < 0) ts.push(t);
  });
  return ts;
}
function linkBody(text){
  return LH.esc(text).replace(/#([^\s#]{1,20})/g, function(_, t){
    return '<a class="hash" href="/community?tab=search&q=' + encodeURIComponent(t) + '">#' + t + '</a>';
  });
}
function needLogin(){
  location.href = '/login?next=' + encodeURIComponent(location.pathname);
}
function syncBar(p){
  document.getElementById('pbar').hidden = false;
  var lk = document.getElementById('like'), fv = document.getElementById('fav');
  lk.className = 'pact' + (p.liked ? ' on' : '');
  lk.innerHTML = (p.liked ? '♥' : '♡') + '<small id="likeN">' + (p.likes || 0) + '</small>';
  fv.className = 'pact' + (p.favorited ? ' on' : '');
  fv.innerHTML = (p.favorited ? '★' : '☆') + '<small id="favN">' + (p.favs || 0) + '</small>';
  document.getElementById('cmtN').textContent = p.comments || (p.comment_list || []).length || 0;
}
function bindHero(images){
  var box = document.getElementById('hero');
  if (!images || !images.length){
    document.body.classList.add('no-hero'); box.innerHTML = ''; return;
  }
  document.body.classList.remove('no-hero');
  var dots = images.length > 1 ? '<div class="pdots">' + images.map(function(_, i){ return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('') + '</div>' : '';
  box.innerHTML = '<div class="phero"><div class="phero-track" id="heroTrack">' + images.map(function(im, i){
    return '<img alt="" decoding="async" src="/api/community/img/' + im.id + '" data-full="/api/community/img/' + im.id + '">';
  }).join('') + '</div>' + dots + '</div>';
  var track = document.getElementById('heroTrack');
  var ds = box.querySelectorAll('.pdots i');
  track.addEventListener('scroll', function(){
    var i = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
    ds.forEach(function(d, j){ d.className = (j === i) ? 'on' : ''; });
  }, {passive: true});
  track.querySelectorAll('img').forEach(function(im){ im.onclick = function(){ zoom(im.dataset.full); }; });
}
function goComments(){
  var el = document.getElementById('cbox');
  if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  var c = document.getElementById('cbody'); if (c) try { c.focus(); } catch(e){}
}
var me = null, booted = false;
async function load(){
  if (!booted){ me = await LH.userbar(); booted = true; }
  var box = document.getElementById('post'), p;
  try {
    p = await LH.api('GET', '/api/community/posts/' + pid);
  } catch(e){
    box.innerHTML = '<div class="empty">' + LH.esc(e.message) + (e.status === 401 ? '<br><br><a class="btn primary" href="/login?next=' + encodeURIComponent(location.pathname) + '">登录 / 注册</a>' : (e.status === 403 ? '<br><br><a class="btn primary" href="/member">了解会员</a>' : '')) + '</div>';
    return;
  }
  document.title = (p.title || '帖子') + ' · 韩友圈';
  bindHero(p.images || []);
  document.getElementById('warn').innerHTML = (p.status === 'pending' ? '<div class="pending">⏳ 这篇帖子正在等待管理员审核，目前只有你自己能看到。' + (p.review_note ? '（' + LH.esc(p.review_note) + '）' : '') + '住宿、包车用车、医美等商业信息请开通商家会员后在商家专区发布。详见<a href="/rules#r3">社区约定</a>。</div>' : '') +
    (p.status === 'rejected' ? '<div class="pending">❌ 这篇帖子未通过审核：' + LH.esc(p.review_note || '') + '</div>' : '') +
    (WARN[p.board] ? '<div class="warn">' + WARN[p.board] + '</div>' : '');
  var topics = topicList(p);
  var bodyHtml = linkBody(p.body || '');
  topics.forEach(function(t){
    if ((p.body || '').indexOf('#' + t) < 0) bodyHtml += ' <a class="hash" href="/community?tab=search&q=' + encodeURIComponent(t) + '">#' + LH.esc(t) + '</a>';
  });
  var locParts = [];
  if (p.area) locParts.push(p.area);
  if (p.place && (!p.area || p.place.indexOf(p.area) < 0)) locParts.push(p.place);
  else if (p.place && p.place !== p.area) locParts = [p.place.indexOf(p.area) >= 0 ? p.place : (p.area + ' · ' + p.place)];
  var locText = (p.place && p.area && p.place !== p.area && p.place.indexOf(p.area) < 0) ? (p.area + ' · ' + p.place) : (p.place || p.area || '');
  var guess = topics[0] || p.place || p.area || '';
  if (guess && locText && guess === p.area && p.place) guess = p.place;
  var chips = '';
  if (locText) chips += '<a class="pchip" href="/community?tab=area&city=' + encodeURIComponent(p.area || '') + '">📍 ' + LH.esc(locText) + '</a>';
  if (guess) chips += '<a class="pchip search" href="/community?tab=search&q=' + encodeURIComponent(guess) + '">猜你想搜  ' + LH.esc(guess) + '</a>';
  var spotHtml = '';
  if (p.spot_name){
    var priceTxt = (p.avg_price != null && p.avg_price !== '') ? ('<span class="pprice"> · 人均 ₩' + Number(p.avg_price).toLocaleString('en-US') + '</span>') : '';
    spotHtml = '<div class="pspot">' + LH.esc(p.spot_name) + (p.spot_area ? ' · ' + LH.esc(p.spot_area) : '') + priceTxt + '</div>';
  }
  box.innerHTML =
    '<div class="meta" style="margin-top:0">' + LH.postFlags(p) + (p.merchant ? '<span class="tag biz">商家</span>' : '') + '<span class="tag">' + LH.esc(p.board_name) + '</span>' + (p.tag_name ? '<span class="tag">' + LH.esc(p.tag_name) + '</span>' : '') + '<span>' + LH.esc(p.time) + '</span>' + (p.merchant || p.views ? '<span>👁 ' + (p.views || 0) + '</span>' : '') + '</div>' +
    (p.title ? '<h1 class="ptitle">' + (p.tag_name ? '<span style="color:#146E68">[' + LH.esc(p.tag_name) + ']</span> ' : '') + LH.esc(p.title) + '</h1>' : '') +
    spotHtml +
    '<div class="author-row"><a class="avlink" href="/community/u/' + p.author_id + '">' + LH.avatar(p.author_id, p.author, p.has_avatar, 'lg') + '</a><div class="who-txt"><div><a href="/community/u/' + p.author_id + '" style="color:inherit;text-decoration:none">' + LH.esc(p.author) + '</a>' + LH.badge(p.author_tier) + LH.vb(p.author_verified) + LH.ubadges(p.author_badges, p.author_official, 4) + '</div>' +
    (p.mine ? '' : '<div class="pm-acts">' +
      '<button class="jbtn' + (p.following ? ' on' : '') + '" id="fol" style="padding:2px 10px;font-size:12px">' + (p.following ? '已关注' : '＋ 关注') + '</button>' +
      (p.consult ? '<a class="btn sm primary" href="' + LH.consultHref('post', p.id) + '">💬 立即咨询</a>' : '<button class="btn sm primary" type="button" id="pmBtn">✉️ 私聊</button>') +
    '</div>') + '</div></div>' +
    (p.offer || p.valid_until ? '<div class="offerbox">' + (p.offer ? '🎁 <b>' + LH.esc(p.offer) + '</b>' : '') + (p.valid_until ? '<div class="tip" style="margin:4px 0 0">有效期至 ' + LH.esc(p.valid_until) + '</div>' : '') + '</div>' : '') +
    ((p.body || '').trim() ? '<div class="body">' + bodyHtml + '</div>' : '') +
    (chips ? '<div class="pchips">' + chips + '</div>' : '') +
    (p.medical_note ? '<div class="mednote">⚠️ ' + LH.esc(p.medical_note) + '</div>' : '') +
    (p.consult ? LH.consultBtn('post', p.id, '立即咨询（站内沟通）') : '') +
    '<div class="row" style="margin-top:14px;justify-content:space-between"><span class="row" style="gap:8px"><button class="btn sm ghost" type="button" id="share">分享</button></span>' +
    '<span class="row">' + (p.mine ? '<button class="linkbtn" id="delp">删除</button>' : '') + '<button class="linkbtn" id="repp">🚩 举报</button></span></div>';
  syncBar(p);
  document.getElementById('like').onclick = async function(){
    if (!me || !me.user){ needLogin(); return; }
    if (me.user.tier < 1){ if (confirm('开通会员后才能点赞。去了解会员？')) location.href = '/member'; return; }
    try { var r = await LH.api('POST', '/api/community/posts/' + pid + '/like', {}); p.liked = r.liked; p.likes = r.likes; syncBar(p); } catch(e){ alert(e.message); }
  };
  document.getElementById('fav').onclick = async function(){
    if (!me || !me.user){ needLogin(); return; }
    if (me.user.tier < 1){ if (confirm('开通会员后才能收藏。去了解会员？')) location.href = '/member'; return; }
    try { var r = await LH.api('POST', '/api/community/posts/' + pid + '/favorite', {}); p.favorited = r.favorited; p.favs = r.favs; syncBar(p); } catch(e){ alert(e.message); }
  };
  document.getElementById('cmtBtn').onclick = goComments;
  document.getElementById('pbarTalk').onclick = function(){
    if (!me || !me.user){ needLogin(); return; }
    goComments();
  };
  document.getElementById('share').onclick = function(){ LH.share({title: p.title, text: '来自旅韩助手韩友圈', url: location.origin + '/community/post/' + pid, targetType: 'post', targetId: pid}); };
  document.getElementById('repp').onclick = function(){ LH.report('post', pid); };
  var fol = document.getElementById('fol');
  if (fol) fol.onclick = async function(){
    if (!me || !me.user){ needLogin(); return; }
    try { var r = await LH.api('POST', '/api/community/follow/' + p.author_id, {}); fol.className = 'jbtn' + (r.following ? ' on' : ''); fol.textContent = r.following ? '已关注' : '＋ 关注'; } catch(e){ alert(e.message); }
  };
  var pm = document.getElementById('pmBtn');
  if (pm) pm.onclick = async function(){
    if (!me || !me.user){ needLogin(); return; }
    pm.disabled = true;
    try { var r = await LH.api('POST', '/api/chat/start', {post_id: pid}); location.href = '/community/messages/' + r.thread_id; }
    catch(e){ alert(e.message); pm.disabled = false; }
  };
  var dp = document.getElementById('delp');
  if (dp) dp.onclick = async function(){ if (!confirm('确定删除这篇帖子？')) return; try { await LH.api('DELETE', '/api/community/posts/' + pid); location.href = '/community'; } catch(e){ alert(e.message); } };
  document.getElementById('cbox').style.display = 'block';
  var list = p.comment_list || [];
  document.getElementById('ctitle').textContent = '评论 ' + list.length;
  var cl = document.getElementById('clist');
  var byId = {};
  list.forEach(function(c){ byId[c.id] = c; });
  var kids = {};
  var roots = [];
  list.forEach(function(c){
    if (c.parent_id && byId[c.parent_id]) {
      (kids[c.parent_id] = kids[c.parent_id] || []).push(c);
    } else {
      roots.push(c);
    }
  });
  function cmtHtml(c, isReply){
    var who = (c.official ? '<span class="woff">官方</span>' : '');
    var replyTo = (isReply && c.parent_id && byId[c.parent_id]) ? ('<span style="color:var(--sub);font-weight:400"> 回复 </span>@' + LH.esc(byId[c.parent_id].author)) : '';
    return '<div class="cmt' + (isReply ? ' reply' : '') + '" id="c' + c.id + '">' +
      '<a class="avlink" href="/community/u/' + c.author_id + '">' + LH.avatar(c.author_id, c.author, c.has_avatar || c.is_bot, 'sm') + '</a>' +
      '<div class="cmt-main"><div class="row" style="justify-content:space-between"><span class="who"><a href="/community/u/' + c.author_id + '" style="color:inherit;text-decoration:none">' + LH.esc(c.author) + '</a>' + who + (c.is_bot ? '<span class="ai-tag">AI</span>' : LH.badge(c.author_tier) + LH.ubadges(c.badges, c.official, 2)) +
      replyTo +
      ' <span style="font-weight:400;color:var(--sub);font-size:12px">' + LH.esc(c.time) + '</span></span><span>' +
      (c.mine ? '<button class="linkbtn" data-delc="' + c.id + '">删除</button>' : '') + '<button class="linkbtn" data-repc="' + c.id + '">举报</button></span></div>' +
      '<div class="ct">' + LH.esc(c.body) + '</div>' +
      '<button type="button" class="creply" data-reply="' + c.id + '" data-name="' + LH.esc(c.author) + '">回复</button></div></div>';
  }
  var html = '';
  roots.forEach(function(c){
    html += cmtHtml(c, false);
    (kids[c.id] || []).forEach(function(k){ html += cmtHtml(k, true); });
  });
  cl.innerHTML = list.length ? html : '<div class="empty" style="padding:12px">还没有评论</div>';
  cl.querySelectorAll('[data-repc]').forEach(function(b){ b.onclick = function(){ LH.report('comment', +b.dataset.repc); }; });
  cl.querySelectorAll('[data-delc]').forEach(function(b){ b.onclick = async function(){ if (!confirm('删除这条评论？')) return; try { await LH.api('DELETE', '/api/community/comments/' + b.dataset.delc); load(); } catch(e){ alert(e.message); } }; });
  var replyTo = null;
  function bindReplyBtns(){
    cl.querySelectorAll('[data-reply]').forEach(function(b){
      b.onclick = function(){
        var ta = document.getElementById('cbody');
        if (!ta){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
        replyTo = {id: +b.dataset.reply, name: b.dataset.name || ''};
        var tip = document.getElementById('replyTip');
        if (tip){ tip.hidden = false; tip.innerHTML = '回复 @' + LH.esc(replyTo.name) + ' <button type="button" class="linkbtn" id="replyCancel">取消</button>';
          var cbtn = document.getElementById('replyCancel');
          if (cbtn) cbtn.onclick = function(){ replyTo = null; tip.hidden = true; ta.placeholder = '友善发言，分享你的经验'; };
        }
        ta.placeholder = '回复 @' + replyTo.name;
        ta.focus();
      };
    });
  }
  bindReplyBtns();
  var cf = document.getElementById('cform');
  if (!me || !me.user){
    cf.innerHTML = '<a class="btn ghost block" href="/login?next=' + encodeURIComponent(location.pathname) + '">登录后参与讨论</a>';
  } else if (me.user.tier < p.comment_tier){
    cf.innerHTML = p.comment_tier >= 2 ? '<a class="btn primary block" href="/member">旅韩交友评论需开通高级会员</a>' : '<a class="btn primary block" href="/member">开通会员即可评论</a>';
  } else {
    cf.innerHTML = '<div class="err" id="cerr"></div><div class="reply-tip" id="replyTip" hidden></div><textarea class="f" id="cbody" maxlength="500" style="min-height:80px" placeholder="友善发言，分享你的经验"></textarea>' +
      '<button class="btn primary block" id="csend" style="margin-top:8px">发表评论</button>';
    document.getElementById('csend').onclick = async function(){
      var t = document.getElementById('cbody').value.trim(); if (!t) return;
      this.disabled = true;
      var payload = {body: t};
      if (replyTo && replyTo.id) payload.parent_id = replyTo.id;
      try { await LH.api('POST', '/api/community/posts/' + pid + '/comments', payload); load(); }
      catch(e){ LH.showErr(document.getElementById('cerr'), e.message); this.disabled = false; }
    };
  }
}
load();
</script>
<script src="/static/pwa.js?v=92" defer></script>
</body>
</html>
