<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>帖子详情 · 旅韩助手</title>
<meta name="description" content="旅韩助手社区帖子">
<meta name="theme-color" content="#ff6b8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pwa.css">
<link rel="stylesheet" href="/static/community.css">
</head>
<body>
<header>
  <h1>🧭 韩友圈</h1>
  <p><a href="/community">← 返回社区</a></p>
</header>
<main>
  <div class="card userbar" id="ub">加载中…</div>
  <div id="warn"></div>
  <div class="card" id="post"><div class="loading">加载中…</div></div>
  <div class="card" id="cbox" style="display:none">
    <h2 id="ctitle">评论</h2>
    <div id="clist"></div>
    <div id="cform" style="margin-top:10px"></div>
  </div>
  <div class="disclaimer">帖子内容为网友个人经验，仅供参考，不代表本站观点。商家信息由商家自行负责。</div>
  <div class="footlinks"><a href="/rules">社区约定</a>·<a href="/member">会员说明</a>·<a href="/community">社区首页</a></div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">旅韩助手为个人运营的免费信息网站，内容仅供参考，不是旅行社，不代办签证。<br><a href="/terms" style="color:#2c7be5">用户协议与免责声明</a> · <a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/rules" style="color:#2c7be5">社区约定</a></p>
</main>
<div class="lightbox" id="lb"><img alt=""></div>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
</nav>
<script src="/static/community.js"></script>
<script>
var pid = parseInt(location.pathname.split('/').pop(), 10);
var WARN = {visa: '⚠️ 本帖为网友个人签证经验，本站不提供签证代办。政策以韩国驻华使领馆、韩国签证申请中心和 K-ETA 官网为准。',
  study: '⚠️ 本帖为网友留学经验分享，本站不提供留学中介或代办服务，招生信息以学校官网为准。',
  friends: '⚠️ 交友请注意安全：不要转账借钱，不要透露证件和住址，线下见面选公共场所。',
  group: '⚠️ 结伴同行请自行核实对方身份，费用 AA 透明，谨防收定金骗局。',
  hotel: '🏨 商家信息由商家自行发布并负责，本站不担保其资质、价格和服务。预订前请核实营业登记，使用正规支付并保留凭证。',
  car: '🚗 商家信息由商家自行发布并负责。租车包车请确认对方具备租赁或客运资质和保险，费用当面确认，谨慎预付。',
  clinic: '🏥 商家信息由商家自行发布并负责，本站不担保医疗效果。请选择合法医疗机构，遵医嘱，谨慎对待“包效果”类宣传。',
  agency: '🏫 机构信息由商家自行发布并负责，本站不提供留学中介服务。请核实机构资质，学校和签证信息以学校官网、使领馆为准，签合同前看清退费条款。',
  daigou: '🛍️ 代购信息由商家自行发布并负责。请确认商品来源和价格，尽量使用有交易保障的支付方式，注意入境免税额度和海关规定。',
  guide: '🙋 地陪信息由商家自行发布并负责。在韩国为外国游客提供有偿导游服务通常需要相应资质，请事先确认身份、价格和服务内容，谨慎预付。',
  kpop: '🎤 活动信息由发布者负责，请以主办方、经纪公司和正规售票平台公告为准。不要购买黄牛票或向个人预付抢票费用。',
};
var lb = document.getElementById('lb');
lb.onclick = function(){ lb.style.display = 'none'; };
function zoom(src){ lb.querySelector('img').src = src; lb.style.display = 'flex'; }
var me = null, booted = false;
async function load(){
  if (!booted){ me = await LH.userbar(document.getElementById('ub')); booted = true; }
  var box = document.getElementById('post'), p;
  try {
    p = await LH.api('GET', '/api/community/posts/' + pid);
  } catch(e){
    box.innerHTML = '<div class="empty">' + LH.esc(e.message) + (e.status === 401 ? '<br><br><a class="btn primary" href="/login?next=' + encodeURIComponent(location.pathname) + '">登录 / 注册</a>' : (e.status === 403 ? '<br><br><a class="btn primary" href="/member">了解会员</a>' : '')) + '</div>';
    return;
  }
  document.title = p.title + ' · 韩友圈';
  document.getElementById('warn').innerHTML = (p.status === 'pending' ? '<div class="pending">⏳ 这篇帖子正在等待管理员审核，目前只有你自己能看到。' + (p.review_note ? '（' + LH.esc(p.review_note) + '）' : '') + '住宿、包车用车、医美等商业信息请开通商家会员后在商家专区发布。详见<a href="/rules#r3">社区约定</a>。</div>' : '') +
    (p.status === 'rejected' ? '<div class="pending">❌ 这篇帖子未通过审核：' + LH.esc(p.review_note || '') + '</div>' : '') +
    (WARN[p.board] ? '<div class="warn">' + WARN[p.board] + '</div>' : '');
  var g = p.images.length ? '<div class="gallery' + (p.images.length === 1 ? ' one' : '') + '">' + p.images.map(function(i){
    return '<img loading="lazy" alt="" src="/api/community/img/' + i.id + (p.images.length === 1 ? '' : '?t=1') + '" data-full="/api/community/img/' + i.id + '">';
  }).join('') + '</div>' : '';
  box.innerHTML = '<div class="meta" style="margin-top:0">' + (p.merchant ? '<span class="tag biz">商家</span>' : '') + '<span class="tag">' + LH.esc(p.board_name) + '</span><span>' + LH.esc(p.time) + '</span></div>' +
    '<h2 style="color:var(--ink);font-size:19px;margin:10px 0 4px">' + LH.esc(p.title) + '</h2>' +
    '<div class="author-row"><span>' + LH.avatar(p.author_id, p.author, p.has_avatar, 'lg') + '</span><div class="who-txt"><div>' + LH.esc(p.author) + LH.badge(p.author_tier) + LH.vb(p.author_verified) + '</div>' +
    (p.mine ? '' : '<button class="jbtn' + (p.following ? ' on' : '') + '" id="fol" style="padding:2px 10px;font-size:12px;margin-top:4px">' + (p.following ? '已关注' : '＋ 关注') + '</button>') + '</div></div>' +
    '<div class="body">' + LH.esc(p.body) + '</div>' + g +
    '<div class="row" style="margin-top:14px;justify-content:space-between"><span class="row" style="gap:8px"><button class="btn sm ghost" id="like">' + (p.liked ? '❤️ 已赞 ' : '🤍 点赞 ') + p.likes + '</button>' +
    '<button class="btn sm ghost" type="button" id="share">分享</button></span>' +
    '<span class="row">' + (p.mine ? '<button class="linkbtn" id="delp">删除</button>' : '') + '<button class="linkbtn" id="repp">🚩 举报</button></span></div>';
  box.querySelectorAll('.gallery img').forEach(function(im){ im.onclick = function(){ zoom(im.dataset.full); }; });
  document.getElementById('like').onclick = async function(){
    if (!me || !me.user){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    if (me.user.tier < 1){ if (confirm('开通会员后才能点赞。去了解会员？')) location.href = '/member'; return; }
    try { var r = await LH.api('POST', '/api/community/posts/' + pid + '/like', {}); this.textContent = (r.liked ? '❤️ 已赞 ' : '🤍 点赞 ') + r.likes; } catch(e){ alert(e.message); }
  };
  document.getElementById('share').onclick = function(){ LH.share({title: p.title, text: '来自旅韩助手韩友圈', url: location.origin + '/community/post/' + pid, targetType: 'post', targetId: pid}); };
  document.getElementById('repp').onclick = function(){ LH.report('post', pid); };
  var fol = document.getElementById('fol');
  if (fol) fol.onclick = async function(){
    if (!me || !me.user){ location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    try { var r = await LH.api('POST', '/api/community/follow/' + p.author_id, {}); fol.className = 'jbtn' + (r.following ? ' on' : ''); fol.textContent = r.following ? '已关注' : '＋ 关注'; } catch(e){ alert(e.message); }
  };
  var dp = document.getElementById('delp');
  if (dp) dp.onclick = async function(){ if (!confirm('确定删除这篇帖子？')) return; try { await LH.api('DELETE', '/api/community/posts/' + pid); location.href = '/community'; } catch(e){ alert(e.message); } };
  document.getElementById('cbox').style.display = 'block';
  document.getElementById('ctitle').textContent = '评论 ' + p.comment_list.length;
  var cl = document.getElementById('clist');
  cl.innerHTML = p.comment_list.length ? p.comment_list.map(function(c){
    return '<div class="cmt">' + LH.avatar(c.author_id, c.author, c.has_avatar || c.is_bot, 'sm') +
      '<div class="cmt-main"><div class="row" style="justify-content:space-between"><span class="who">' + LH.esc(c.author) + (c.is_bot ? '<span class="ai-tag">AI</span>' : LH.badge(c.author_tier)) +
      ' <span style="font-weight:400;color:var(--sub);font-size:12px">' + LH.esc(c.time) + '</span></span><span>' +
      (c.mine ? '<button class="linkbtn" data-delc="' + c.id + '">删除</button>' : '') + '<button class="linkbtn" data-repc="' + c.id + '">举报</button></span></div>' +
      '<div class="ct">' + LH.esc(c.body) + '</div></div></div>';
  }).join('') : '<div class="empty" style="padding:12px">还没有评论</div>';
  cl.querySelectorAll('[data-repc]').forEach(function(b){ b.onclick = function(){ LH.report('comment', +b.dataset.repc); }; });
  cl.querySelectorAll('[data-delc]').forEach(function(b){ b.onclick = async function(){ if (!confirm('删除这条评论？')) return; try { await LH.api('DELETE', '/api/community/comments/' + b.dataset.delc); load(); } catch(e){ alert(e.message); } }; });
  var cf = document.getElementById('cform');
  if (!me || !me.user){
    cf.innerHTML = '<a class="btn ghost block" href="/login?next=' + encodeURIComponent(location.pathname) + '">登录后参与讨论</a>';
  } else if (me.user.tier < p.comment_tier){
    cf.innerHTML = p.comment_tier >= 2 ? '<a class="btn primary block" href="/member">旅韩交友评论需开通高级会员</a>' : '<a class="btn primary block" href="/member">开通会员即可评论</a>';
  } else {
    cf.innerHTML = '<div class="err" id="cerr"></div><textarea class="f" id="cbody" maxlength="500" style="min-height:80px" placeholder="友善发言，分享你的经验"></textarea>' +
      '<button class="btn primary block" id="csend" style="margin-top:8px">发表评论</button>';
    document.getElementById('csend').onclick = async function(){
      var t = document.getElementById('cbody').value.trim(); if (!t) return;
      this.disabled = true;
      try { await LH.api('POST', '/api/community/posts/' + pid + '/comments', {body: t}); load(); }
      catch(e){ LH.showErr(document.getElementById('cerr'), e.message); this.disabled = false; }
    };
  }
}
load();
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
