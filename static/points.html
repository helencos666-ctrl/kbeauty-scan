<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行豆 · 旅韩助手</title>
<meta name="description" content="旅韩助手旅行豆：签到、分享和常用功能可累积，兑换权益即将上线。">
<meta name="theme-color" content="#ff6b8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pwa.css">
<link rel="stylesheet" href="/static/community.css">
</head>
<body>
<header>
  <h1>🫘 旅行豆</h1>
  <p>完成日常任务即可累积，兑换权益即将上线</p>
</header>
<main>
  <div class="card userbar" id="ub">加载中…</div>

  <div class="err" id="err" style="display:none"></div>
  <div class="ok" id="ok" style="display:none"></div>
  <div class="card" id="bal">加载中…</div>
  <div class="card">
    <h2>怎么得旅行豆</h2>
    <div id="rules"></div>
    <p class="tip">每天按韩国时间（UTC+9）计算次数。分享同一条内容当天只奖励一次，每天最多 3 次分享奖励。</p>
  </div>
  <div class="card">
    <h2>兑换（即将上线）</h2>
    <div id="catalog"></div>
    <p class="tip">以下项目目前不能兑换，上线后另行通知。</p>
  </div>
  <div class="card">
    <h2>明细</h2>
    <div id="hist"></div>
  </div>
  <div class="footlinks"><a href="/points">旅行豆</a>·<a href="/coupons">卡券</a>·<a href="/shops">推荐店铺</a>·<a href="/member">会员</a>·<a href="/community">社区</a></div>
  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">旅韩助手为个人运营的免费信息网站，内容仅供参考，不是旅行社，不代办签证。<br><a href="/terms" style="color:#2c7be5">用户协议与免责声明</a> · <a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/rules" style="color:#2c7be5">社区约定</a></p>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/attractions"><i>🗺️</i>景点</a>
  <a href="/tips"><i>📘</i>攻略</a>
  <a href="/community"><i>💬</i>社区</a>
  <a href="/member"><i>👑</i>会员</a>
</nav>
<script src="/static/community.js"></script>

<script>
(async function(){
  var d = await LH.userbar(document.getElementById('ub'));
  var err = document.getElementById('err'), ok = document.getElementById('ok');
  function show(el, t){ el.textContent = t || ''; el.style.display = t ? 'block' : 'none'; }
  if (!d || !d.user){
    document.getElementById('bal').innerHTML = '<h2>我的旅行豆</h2><p>登录后即可签到、查看余额和明细。</p><a class="btn primary block" href="/login?next=/points">免费注册 / 登录</a>';
    return;
  }
  async function render(){
    var p;
    try { p = await LH.api('GET', '/api/points'); } catch(e){ document.getElementById('bal').innerHTML = '<p>' + LH.esc(e.message) + '</p>'; return p; }
    document.getElementById('bal').innerHTML = '<h2>我的旅行豆</h2><p style="margin:0 0 12px;font-size:32px;font-weight:800;color:var(--pink)">' + p.balance +
      ' <span style="font-size:16px;font-weight:600">旅行豆</span></p>' +
      '<p class="tip" style="margin-top:0">连续签到 ' + (p.streak || 0) + ' 天</p>' +
      '<div class="row" style="gap:8px;flex-wrap:wrap">' +
      '<button class="btn primary" type="button" id="ck"' + (p.checked_in_today ? ' disabled' : '') + '>' + (p.checked_in_today ? '今天已签到' : '今日签到 +10') + '</button>' +
      '<a class="btn ghost" href="/coupons">卡券' + (function(){ var n=(p.coupons||[]).filter(function(c){ return c.status==='available'; }).length; return n? ' · '+n : ''; })() + '</a>' +
      '<a class="btn ghost" href="/shops">推荐店铺</a></div>';
    var ck = document.getElementById('ck');
    if (ck && !p.checked_in_today) ck.onclick = async function(){
      ck.disabled = true;
      try { var r = await LH.api('POST', '/api/points/checkin', {}); show(ok, r.reason || ('签到成功，余额 ' + r.balance)); show(err, ''); await render(); }
      catch(e){ show(err, e.message); ck.disabled = false; }
    };
    document.getElementById('rules').innerHTML = '<table class="tiers"><tr><th>任务</th><th>奖励</th><th>今日</th></tr>' + (p.rules||[]).map(function(r){
      var today = r.once ? (r.used_today ? '已领' : '未领（仅一次）') : ((r.used_today||0) + ' / ' + (r.daily_cap||0));
      return '<tr><td>' + LH.esc(r.label) + '</td><td class="price">+' + r.points + '</td><td>' + today + '</td></tr>';
    }).join('') + '</table>';
    document.getElementById('catalog').innerHTML = (p.catalog||[]).map(function(c){
      return '<div class="cmt"><div class="who">' + LH.esc(c.title) + ' · ' + c.cost + ' 旅行豆</div><div class="meta"><span class="tag">' + LH.esc(c.status) + '</span><span>' + LH.esc(c.note||'') + '</span></div>' +
        '<button class="btn sm gray" type="button" data-rd="' + LH.esc(c.id) + '" style="margin-top:8px">兑换</button></div>';
    }).join('') || '<div class="empty">暂无</div>';
    document.querySelectorAll('[data-rd]').forEach(function(b){ b.onclick = async function(){
      try { await LH.api('POST', '/api/points/redeem', {id: b.dataset.rd}); }
      catch(e){ alert(e.message); }
    }; });
    document.getElementById('hist').innerHTML = (p.history&&p.history.length) ? p.history.map(function(h){
      var sign = h.points > 0 ? '+' : '';
      return '<div class="cmt"><div class="who">' + LH.esc(h.label) + ' <b style="color:var(--pink)">' + sign + h.points + '</b></div><div class="meta"><span>' + LH.esc(h.time) + '</span></div></div>';
    }).join('') : '<div class="empty">还没有明细</div>';
    return p;
  }
  await render();
})();
</script>

<script src="/static/pwa.js" defer></script>
</body>
</html>
