<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=99">

<link rel="stylesheet" href="/static/pwa.css?v=99">
<link rel="stylesheet" href="/static/guide.css?v=99">
<style>
:root{--primary:#146E68;--secondary:#3D8F88;--accent:#B85A12;--pink:var(--primary);--ink:#1A2330;--sub:#4A5560;--bg:#F3F7F6;--card:#fff;--line:#D5E4E1;--success:#1B7A45;--warning:#B45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:132px}
header{background:linear-gradient(135deg,#146E68,#3D8F88);color:#fff;padding:20px 18px 30px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:21px}
header p{margin:6px 0 0;font-size:14px;opacity:.95}
main{max-width:560px;margin:-18px auto 0;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(20,110,104,.08);margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--primary)}
.card p,.card li{font-size:15px;line-height:1.7;margin:0 0 8px}
.card ul,.card ol{margin:0 0 8px;padding-left:20px}
.tip{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.note{font-size:13px;color:#555;background:#fff8f0;border-radius:10px;padding:10px 12px;line-height:1.65;margin:8px 0}
.badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#E6F3F1;color:var(--primary);margin:0 6px 6px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600;background:var(--primary);color:#fff;border:0;width:100%;cursor:pointer}
.btn.ghost{background:#E6F3F1;color:var(--primary)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:14px;margin:4px 6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
nav a{flex:1;border:0;background:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none}
nav a i{font-style:normal;font-size:20px}
nav a.on{color:var(--primary);font-weight:700}
.day{border-top:1px solid var(--line);padding:10px 0}
.st{font-size:13px;color:#555;line-height:1.65}
.qty{width:64px;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.menu-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:0;border-radius:20px;padding:7px 13px;font-size:14px;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.chips button.on{background:var(--primary);color:#fff}
</style>
</head>
<body>
<header>
  <h1>🗺️ 首尔路线卡片</h1>
  <p>按兴趣选 3 日走法，站点可对照地铁图</p>
</header>
<main>

  <div class="card">
    <p class="note">以下为 3 日首尔路线卡片，按兴趣选择。站点编号来自首尔地铁公开资料，查阅日期 2026-11-15。本站不推荐付费店铺，开放时间与运营状况以现场为准。</p>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list">加载中…</div>
  <div class="card">
    <a class="btn ghost" href="/?tab=sub" style="margin-bottom:8px">去查地铁换乘</a>
    <a class="btn ghost" href="/pay">支付与交通卡</a>
  </div>

  <p style="font-size:12px;color:#888;text-align:center;margin:10px 0 16px;line-height:1.7">旅韩助手为个人运营的免费信息网站，内容仅供参考，不是旅行社，不代办签证。<br><a href="/terms" style="color:#2c7be5">用户协议与免责声明</a> · <a href="/privacy" style="color:#2c7be5">隐私政策</a> · <a href="/rules" style="color:#2c7be5">社区约定</a></p>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>

<script>
(async function(){
  var data = [];
  try {
    var r = await fetch('/static/itineraries.json', {cache:'no-cache'});
    data = await r.json();
  } catch(e){ document.getElementById('list').textContent = '路线暂时无法加载，请稍后重试。'; return; }
  var cur = (location.hash||'').replace('#','') || 'classic';
  var chips = document.getElementById('chips'), list = document.getElementById('list');
  function render(){
    chips.innerHTML = data.map(function(t){
      return '<button type="button" data-id="'+t.id+'" class="'+(t.id===cur?'on':'')+'">'+t.title+'</button>';
    }).join('');
    var t = data.find(function(x){return x.id===cur}) || data[0];
    cur = t.id;
    list.innerHTML = '<div class="card"><h2>'+t.title+' · '+t.days+' 日</h2><p>'+t.summary+'</p><p class="st">交通：'+t.transport+'</p>'+
      t.days_detail.map(function(d){
        return '<div class="day"><h3>第 '+d.day+' 天 · '+d.theme+'</h3><p>'+d.stops.join('、')+'</p>'+
          '<p class="st">地铁：'+(d.stations||[]).join('；')+'</p><p class="tip">'+d.note+'</p></div>';
      }).join('')+'</div>';
    chips.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){ cur=b.dataset.id; history.replaceState(null,'','#'+cur); render(); };
    });
  }
  render();
})();
</script>

<script src="/static/pwa.js?v=99" defer></script>
</body>
</html>
