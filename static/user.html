<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人主页 · 旅韩助手</title>
<meta name="description" content="韩友圈个人主页：徽章与帖子。">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=62">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=62">
<link rel="stylesheet" href="/static/pwa.css?v=62">
<link rel="stylesheet" href="/static/community.css?v=62">
<link rel="stylesheet" href="/static/chat.css?v=62">
<meta name="robots" content="noindex">
</head>
<body>
<header style="padding-bottom:24px">
  <h1 id="h1">👤 个人主页</h1>
  <p><a href="/community">‹ 韩友圈</a></p>
</header>
<main style="padding-bottom:70px">
  <div id="box"><div class="loading">加载中…</div></div>
</main>
<nav>
  <a href="/"><i>🏠</i>首页</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/?tab=card"><i>💬</i>翻译</a>
  <a href="/community" class="on"><i>🧭</i>韩友圈</a>
  <a href="/?tab=more"><i>☰</i>全部</a>
  <a href="/me"><i>👤</i>我的</a>
</nav>
<script src="/static/community.js?v=62"></script>
<script>
var uid = parseInt(location.pathname.split('/').pop(), 10), E = LH.esc;
(async function(){
  var box = document.getElementById('box'), P;
  try { P = await LH.api('GET', '/api/community/users/' + uid); } catch(e){ box.innerHTML = '<div class="card empty">' + E(e.message) + '</div>'; return; }
  document.getElementById('h1').textContent = '👤 ' + P.nickname;
  box.innerHTML = '<div class="card"><div class="author-row"><span>' + LH.avatar(P.id, P.nickname, P.has_avatar, 'lg') + '</span><div class="who-txt"><div><b style="font-size:17px">' + E(P.nickname) + '</b>' + LH.badge(P.tier) + LH.vb(P.verified) + LH.ubadges([], P.official) + '</div>' +
      '<div class="tip" style="margin:2px 0 0">编号 ' + E(String(P.member_no)) + ' · ' + E(P.joined) + ' 加入</div></div></div>' +
      '<div class="row" style="gap:16px;margin-top:10px;font-size:13px;color:var(--sub)"><span><b style="color:var(--ink)">' + P.stats.posts + '</b> 帖子</span><span><b style="color:var(--ink)">' + P.stats.featured + '</b> 精选</span><span><b style="color:var(--ink)">' + P.stats.comments + '</b> 评论</span><span><b style="color:var(--ink)">' + P.stats.followers + '</b> 粉丝</span></div>' +
      (P.mine || P.is_bot ? '' : '<div class="pm-acts" style="margin-top:10px"><button class="jbtn' + (P.following ? ' on' : '') + '" id="fol">' + (P.following ? '已关注' : '＋ 关注') + '</button> <button class="btn sm primary" type="button" id="pmBtn">✉️ 私聊</button></div>') + '</div>' +
    '<div class="card"><h2>🏅 徽章</h2>' + (P.badges.length ? '<div class="bdg-grid">' + P.badges.map(function(b){ return '<div class="bdg"><i>' + b.icon + '</i><b>' + E(b.name) + '</b><small>' + E(b.desc) + '</small></div>'; }).join('') + '</div>' : '<div class="tip" style="margin:0">还没有徽章。发第一篇帖子就能获得「✍️ 首帖」。</div>') + '</div>' +
    '<div class="sech" style="margin:4px 2px 10px"><h2>📝 帖子</h2></div>' + (P.posts.length ? P.posts.map(function(p){ return LH.postItem(p, 0); }).join('') : '<div class="card empty">还没有公开的帖子</div>');
  var fol = document.getElementById('fol');
  if (fol) fol.onclick = async function(){
    try { var r = await LH.api('POST', '/api/community/follow/' + uid, {}); fol.className = 'jbtn' + (r.following ? ' on' : ''); fol.textContent = r.following ? '已关注' : '＋ 关注'; }
    catch(e){ if (e.status === 401) location.href = '/login?next=' + encodeURIComponent(location.pathname); else alert(e.message); }
  };
  var pm = document.getElementById('pmBtn');
  if (pm) pm.onclick = async function(){
    pm.disabled = true;
    try { var r = await LH.api('POST', '/api/chat/start', {peer_id: uid}); location.href = '/community/messages/' + r.thread_id; }
    catch(e){ if (e.status === 401) location.href = '/login?next=' + encodeURIComponent(location.pathname); else { alert(e.message); pm.disabled = false; } }
  };
})();
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
