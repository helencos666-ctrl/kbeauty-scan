<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>博主主页 · 旅韩助手</title>
<meta name="description" content="韩友圈博主主页：作品、粉丝与获赞。">
<meta name="theme-color" content="#146E68">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=93">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=93">
<link rel="stylesheet" href="/static/pwa.css?v=93">
<link rel="stylesheet" href="/static/community.css?v=93">
<meta name="robots" content="noindex">
</head>
<body class="upage">
<a class="pback" href="/community" aria-label="返回">‹</a>
<main>
  <div id="box"><div class="loading">加载中…</div></div>
</main>
<script src="/static/community.js?v=93"></script>
<script>
var uid = parseInt(location.pathname.split('/').pop(), 10), E = LH.esc, P;
function num(n){ n = parseInt(n, 10) || 0; return n > 9999 ? (Math.round(n/1000)/10 + '万') : String(n); }
function render(){
  var box = document.getElementById('box');
  var st = P.stats || {};
  var off = P.official ? '<span class="woff">官方</span>' : '';
  var bio = (P.bio || '').trim();
  var acts = '';
  if (!P.mine && !P.is_bot){
    acts = '<div class="uacts">' +
      '<button type="button" class="jbtn' + (P.following ? ' on' : '') + '" id="fol">' + (P.following ? '已关注' : '关注') + '</button>' +
      '<button type="button" class="btn sm primary" id="pmBtn">私聊</button>' +
    '</div>';
  } else if (P.mine){
    acts = '<div class="uacts"><a class="btn sm ghost" href="/me">编辑资料</a></div>';
  }
  var badges = (P.badges && P.badges.length) ? ('<div class="ubadges">' + P.badges.map(function(b){
    return '<span class="ubg" title="' + E(b.desc || '') + '">' + (b.icon || '') + ' ' + E(b.name) + '</span>';
  }).join('') + '</div>') : '';
  box.innerHTML =
    '<div class="uhero">' +
      '<div class="urow">' +
        '<span class="uav">' + LH.avatar(P.id, P.nickname, P.has_avatar, 'xl') + '</span>' +
        '<div class="uwho">' +
          '<div class="un">' + E(P.nickname) + off + LH.badge(P.tier) + LH.vb(P.verified) + '</div>' +
          '<div class="umeta">加入于 ' + E(P.joined || '') + '</div>' +
          '<div class="ubio">' + (bio ? E(bio) : '<span class="ubio-empty">还没有简介</span>') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="ustats">' +
        '<span><b id="stLikes">' + num(st.likes) + '</b>获赞</span>' +
        '<span><b id="stFans">' + num(st.followers) + '</b>粉丝</span>' +
        '<span><b id="stFollow">' + num(st.following) + '</b>关注</span>' +
      '</div>' +
      acts + badges +
    '</div>' +
    '<div class="uworks"><div class="ulab">作品 ' + num(st.posts) + '</div><div id="uGrid"></div><div id="uEmpty" class="play-hint" hidden></div></div>';
  document.title = (P.nickname || '博主') + ' · 韩友圈';
  var grid = document.getElementById('uGrid'), empty = document.getElementById('uEmpty');
  var posts = P.posts || [];
  if (!posts.length){
    if (empty){ empty.hidden = false; empty.textContent = '还没有公开的作品'; }
  } else if (typeof LH.appendWater === 'function'){
    LH.appendWater(grid, posts, true);
  } else {
    grid.innerHTML = posts.map(function(p){ return LH.postItem(p, 0); }).join('');
  }
  var fol = document.getElementById('fol');
  if (fol) fol.onclick = async function(){
    try {
      var r = await LH.api('POST', '/api/community/follow/' + uid, {});
      P.following = r.following;
      if (r.followers != null) P.stats.followers = r.followers;
      fol.className = 'jbtn' + (r.following ? ' on' : '');
      fol.textContent = r.following ? '已关注' : '关注';
      var el = document.getElementById('stFans');
      if (el) el.textContent = num(P.stats.followers);
    } catch(e){
      if (e.status === 401) location.href = '/login?next=' + encodeURIComponent(location.pathname);
      else alert(e.message);
    }
  };
  var pm = document.getElementById('pmBtn');
  if (pm) pm.onclick = async function(){
    pm.disabled = true;
    try { var r = await LH.api('POST', '/api/chat/start', {peer_id: uid}); location.href = '/community/messages/' + r.thread_id; }
    catch(e){ if (e.status === 401) location.href = '/login?next=' + encodeURIComponent(location.pathname); else { alert(e.message); pm.disabled = false; } }
  };
}
(async function(){
  var box = document.getElementById('box');
  try { P = await LH.api('GET', '/api/community/users/' + uid); } catch(e){ box.innerHTML = '<div class="card empty">' + E(e.message) + '</div>'; return; }
  render();
})();
</script>
<script src="/static/pwa.js?v=93" defer></script>
</body>
</html>
