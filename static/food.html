<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韩国美食推荐 · 旅韩助手</title>
<meta name="description" content="旅韩助手美食指南：按城市和弘大、明洞、江南、广安里、西面等热门区域查看餐厅，资料来自米其林指南与官方旅游介绍。">

<meta name="theme-color" content="#ff6b8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅韩助手">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pwa.css">
<link rel="stylesheet" href="/static/guide.css">
<style>
:root{--pink:#ff4f7b;--ink:#1f2330;--sub:#6b7080;--bg:#fff6f8;--card:#fff;--line:#f0e3e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:132px}
header{background:linear-gradient(135deg,#ff6b8f,#ff9a6b);color:#fff;padding:20px 18px 30px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:21px}
header p{margin:6px 0 0;font-size:14px;opacity:.95}
main{max-width:560px;margin:-18px auto 0;padding:0 14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(255,79,123,.08);margin-bottom:14px}
.tip{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.disclaimer{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 14px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
nav a{flex:1;border:0;background:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none}
nav a i{font-style:normal;font-size:20px}
nav a.on{color:var(--pink);font-weight:700}
#q{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:10px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:0;border-radius:20px;padding:7px 13px;font-size:14px;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.chips button.on{background:var(--pink);color:#fff}
.lab{font-size:12px;color:var(--sub);margin:10px 0 0;font-weight:600}
#areaWrap{display:none}
#areaWrap.show{display:block}
.area-intro{font-size:13px;color:var(--sub);margin:8px 0 0;line-height:1.65}
#count{font-size:13px;color:var(--sub);margin:4px 0 10px}
.place{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(255,79,123,.08);margin-bottom:12px}
.place .name-zh{font-size:18px;font-weight:700;margin:0}
.place .name-ko{font-size:13px;color:var(--sub);margin:3px 0 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;padding:3px 8px;border-radius:20px;background:#ffe8ee;color:var(--pink)}
.badge.gray{background:#eef0f4;color:#555}
.place .desc{font-size:15px;line-height:1.65;margin:10px 0 0}
.meta{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.meta h3{margin:8px 0 4px;font-size:13px;color:var(--pink)}
.meta p,.meta li{font-size:14px;line-height:1.65;margin:0}
.meta ul{margin:0;padding-left:18px}
.go{display:block;margin-top:12px;text-align:center;text-decoration:none;border-radius:12px;padding:12px 8px;font-size:15px;font-weight:700;background:#ffe8ee;color:var(--pink)}
.spin{width:28px;height:28px;border:3px solid #ffd1dc;border-top-color:var(--pink);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 8px}
@keyframes s{to{transform:rotate(360deg)}}
.loading,.empty{text-align:center;padding:28px 10px;color:var(--sub)}
.src a{color:#2c7be5;word-break:break-all}
</style>

</head>
<body>
<header>
  <h1>🇰🇷 旅韩助手</h1>
  <p>韩国美食推荐，按城市、区域和类型查看</p>
</header>
<main>
  <div class="gbar">
    <a href="/attractions">🗺️ 景点</a>
    <a href="/food" class="on">🍜 美食</a>
    <a href="/shopping">🛍️ 购物</a>
    <a href="/tips">📘 攻略</a>
    <a href="/beauty">💄 买妆</a>
    <a href="/community">💬 社区</a>
  </div>

  <div class="card">
    <input id="q" type="search" enterkeyhint="search" placeholder="搜索店名、菜式或区域" autocomplete="off">
    <div class="lab">城市</div>
    <div class="chips" id="cityChips"></div>
    <div id="areaWrap">
      <div class="lab">区域</div>
      <div class="chips" id="areaChips"></div>
      <div class="area-intro" id="areaIntro" hidden></div>
    </div>
    <div class="lab">类型</div>
    <div class="chips" id="catChips"></div>
    <div class="tip" id="priceTip" style="margin-top:8px"></div>
    <div class="tip" id="areaHint">先选城市，再按弘大、明洞、广安里、西面这些热门打卡区域筛选。</div>
  </div>
  <div id="count"></div>
  <div id="list"><div class="loading"><div class="spin"></div>正在载入餐厅…</div></div>
  <div class="disclaimer" id="disc"></div>
  <div class="card src" id="src" style="display:none">
    <div style="font-size:14px;font-weight:700;margin-bottom:8px">资料来源</div>
    <div class="tip" style="margin:0 0 8px">公开资料整理，核对日期见各条。营业与价格可能变化，请出行前再确认。</div>
    <ul id="srcList" style="margin:0;padding-left:18px;font-size:13px;line-height:1.7"></ul>
  </div>

</main>
<nav>
  <a href="/?tab=cos"><i>💄</i>化妆品</a>
  <a href="/?tab=sub"><i>🚇</i>地铁</a>
  <a href="/attractions"><i>🗺️</i>景点</a>
  <a href="/food" class="on"><i>🍜</i>美食</a>
  <a href="/?tab=card"><i>💬</i>沟通卡</a>
  <a href="/?tab=ph"><i>📍</i>常用句</a>
</nav>

<script src="/static/pwa.js" defer></script>
<script src="/static/maps.js"></script>
<script>
var STN={}; LHMap.stations().then(function(s){ STN=s; if(DATA.items&&DATA.items.length) render(); });
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT_ZH={bbq:'韩式烤肉',street:'街头小吃',traditional:'传统韩食',cafe:'咖啡甜点',chicken:'炸鸡啤酒',seafood:'海鲜',chinese_fav:'华人常去'};
let DATA={items:[],categories:[],cities:[],areas:[],sources:[],disclaimer:''};
let city='', area='', cat='', q='';
function areaMeta(id){
  return (DATA.areas||[]).find(a=>a.id===id) || (id==='other'?{id:'other',zh:'其他',intro:'这些店有公开资料可查，但不在上面的热门打卡区域内。'}:null);
}
function chipBar(el, opts, current, onpick){
  el.innerHTML=opts.map(([id,zh])=>`<button type="button" class="${id===current?'on':''}" data-id="${esc(id)}">${esc(zh)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>onpick(b.dataset.id));
}
function filtered(){
  const k=q.trim().toLowerCase();
  return DATA.items.filter(it=>{
    if(city && it.city_zh!==city) return false;
    if(area && (it.area_id||'')!==area) return false;
    if(cat && it.category!==cat && !(cat==='chinese_fav' && (it.tags||[]).includes('chinese_fav'))) return false;
    if(!k) return true;
    const blob=[it.name_zh,it.name_ko,it.area,it.area_id,it.city_zh,it.cuisine,it.desc,it.transport,it.address,(it.tips||[]).join(' ')].join(' ').toLowerCase();
    const am=areaMeta(it.area_id);
    if(am && (am.zh.toLowerCase().includes(k) || (am.intro||'').toLowerCase().includes(k))) return true;
    return blob.includes(k);
  });
}
function render(){
  const arr=filtered();
  const am=area?areaMeta(area):null;
  const where=[city||'', am?am.zh:''].filter(Boolean).join(' · ');
  $('count').textContent=arr.length?(where?`${where}，共 ${arr.length} 条`:`共 ${arr.length} 条`):'没有符合条件的餐厅，试试改筛选或关键词。';
  if(!arr.length){ $('list').innerHTML='<div class="empty">没有符合条件的餐厅</div>'; return; }
  $('list').innerHTML=arr.map(it=>{
    const amItem=areaMeta(it.area_id);
    const badges=[
      `<span class="badge">${esc(it.city_zh)}</span>`,
      `<span class="badge gray">${esc(CAT_ZH[it.category]||it.category)}</span>`
    ];
    if(it.cuisine) badges.push(`<span class="badge gray">${esc(it.cuisine)}</span>`);
    if(amItem) badges.push(`<span class="badge gray">${esc(amItem.zh)}</span>`);
    if(it.area) badges.push(`<span class="badge gray">${esc(it.area)}</span>`);
    if(it.price) badges.push(`<span class="badge">${esc(it.price)}</span>`);
    if((it.tags||[]).includes('bib2026')) badges.push(`<span class="badge">米其林2026必比登</span>`);
    if((it.tags||[]).includes('chinese_fav') && it.category!=='chinese_fav') badges.push(`<span class="badge">华人常去</span>`);
    const rows=[];
    if(it.address) rows.push(`<h3>地址</h3><p>${esc(it.address)}</p>`);
    rows.push(`<h3>怎么去</h3><p>${esc(it.transport)}</p>`);
    if(it.tips&&it.tips.length) rows.push(`<h3>实用提示</h3><ul>${it.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`);
    const go=it.station?`<a class="go" href="/?tab=sub&to=${encodeURIComponent(it.station)}">用地铁查到这里</a>`:'';
    const c=it.station&&STN[it.station]||null;
    const nq=it.map_query||it.name_ko||it.name_zh;
    const aq=it.name_zh||it.name_ko;
    const maps=LHMap.buttons(LHMap.naverSearch(nq), LHMap.amapSearch(aq, c));
    return `<article class="place">
      <div class="name-zh">${esc(it.name_zh)}</div>
      <div class="name-ko">${esc(it.name_ko)}</div>
      <div class="badges">${badges.join('')}</div>
      <p class="desc">${esc(it.desc)}</p>
      <div class="meta">${rows.join('')}</div>
      ${maps}
      ${go}
    </article>`;
  }).join('');
}
function drawFilters(){
  const cities=[['', '全部']].concat((DATA.cities||[]).map(c=>[c,c]));
  chipBar($('cityChips'), cities, city, id=>{city=id; area=''; drawFilters(); render();});
  const wrap=$('areaWrap'), hint=$('areaHint'), intro=$('areaIntro');
  if(!city){
    wrap.classList.remove('show');
    intro.hidden=true;
    intro.textContent='';
    hint.style.display='';
  }else{
    wrap.classList.add('show');
    hint.style.display='none';
    const featured=(DATA.areas||[]).filter(a=>a.city_zh===city);
    const hasOther=(DATA.items||[]).some(it=>it.city_zh===city && it.area_id==='other');
    const opts=[['', '全部']].concat(featured.map(a=>[a.id,a.zh]));
    if(hasOther) opts.push(['other','其他']);
    if(area && !opts.some(([id])=>id===area)) area='';
    chipBar($('areaChips'), opts, area, id=>{area=id; drawFilters(); render();});
    const am=area?areaMeta(area):null;
    if(am && am.intro){ intro.hidden=false; intro.textContent=am.intro; }
    else { intro.hidden=true; intro.textContent=''; }
  }
  const cats=[['', '全部']].concat((DATA.categories||[]).map(c=>[c.id,c.zh]));
  chipBar($('catChips'), cats, cat, id=>{cat=id; drawFilters(); render();});
}
fetch('/static/food.json')
  .then(r=>{if(!r.ok) throw new Error('load'); return r.json()})
  .then(d=>{
    DATA=d;
    $('disc').textContent=d.disclaimer||'';
    if(d.price_legend){ $('priceTip').textContent='价格档（仅在较有把握时标注）：'+(d.price_legend.map(x=>x.zh).join('；'))+'。'; }
    if(d.sources&&d.sources.length){
      $('src').style.display='block';
      $('srcList').innerHTML=d.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>${s.checked?' <span class="tip" style="display:inline;margin:0">（核对 '+esc(s.checked)+'）</span>':''}</li>`).join('');
    }
    drawFilters();
    render();
  })
  .catch(()=>{ $('list').innerHTML='<div class="empty">餐厅数据暂时载入失败，请检查网络后重试。</div>'; });
$('q').addEventListener('input',()=>{q=$('q').value;render()});
</script>

</body>
</html>
