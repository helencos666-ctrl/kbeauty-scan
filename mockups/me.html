<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="m.css">
<style>
body{background:linear-gradient(180deg,#E6F3F1 0,#F3F7F6 260px)}
.prof{display:flex;align-items:center;gap:14px;padding:10px 18px 4px}
.av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#3D8F88,#ffb38a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:800;border:3px solid #fff;box-shadow:0 4px 12px rgba(20,110,104,.25);position:relative}
.av .cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nm{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.lv{font-size:11px;font-weight:800;color:#fff;background:linear-gradient(90deg,#146E68,#3D8F88);padding:2px 8px;border-radius:999px}
.bio{color:var(--sub);font-size:13px;margin-top:4px}
.edit{margin-left:auto;font-size:12px;color:var(--primary);border:1px solid #B7D4D1;border-radius:999px;padding:5px 10px;background:#fff}
.stats{display:flex;background:#fff;border-radius:16px;margin:14px 14px 12px;padding:14px 0;box-shadow:0 4px 16px rgba(20,110,104,.07)}
.stats div{flex:1;text-align:center;border-right:1px solid #E3EEEC}.stats div:last-child{border:0}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.grid a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;position:relative}
.ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.new{position:absolute;top:-4px;right:8px;font-size:9px;background:#ff3b30;color:#fff;border-radius:6px;padding:0 4px}
h3{margin:0 0 12px;font-size:15px}
.menu a{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #E3EEEC;font-size:15px}
.menu a:last-child{border:0}.menu .e{font-size:18px;width:24px;text-align:center}
.menu .ar{margin-left:auto;color:#c4c6cf;font-size:18px}.menu .hint{margin-left:auto;font-size:12px;color:var(--primary)}
.menu .hint+.ar{margin-left:6px}
</style></head><body>
